<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="../../frontend/src/index.css"> <!-- the app's base styles (box-sizing, line-height, the global button rule), so the gallery renders like the app -->
<link rel="stylesheet" href="../gallery.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Tabs, TabPanel, SegmentedControl, FilterChip, FilterChipGroup, Stepper, Pagination, SidebarNavItem, SidebarSectionTitle } = window.GrepThinkDesignSystem_36e7e3;
const PHONE = new URLSearchParams(location.search).has('phone');
const I = ({ d }) => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">{d}</svg>;
const Doc = () => <I d={<><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z" /><path d="M14 2v4a2 2 0 0 0 2 2h4" /></>} />;
const Users = () => <I d={<><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" /><circle cx="9" cy="7" r="4" /></>} />;
const Cal = () => <I d={<><rect x="3" y="4" width="18" height="18" rx="2" /><path d="M16 2v4M8 2v4M3 10h18" /></>} />;
const Home = () => <I d={<><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /><path d="M9 22V12h6v10" /></>} />;
const Msg = () => <I d={<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />} />;
const Table = () => <I d={<><rect x="3" y="3" width="18" height="18" rx="2" /><path d="M3 9h18M3 15h18M9 3v18" /></>} />;
const Grid = () => <I d={<><rect x="3" y="3" width="7" height="7" /><rect x="14" y="3" width="7" height="7" /><rect x="14" y="14" width="7" height="7" /><rect x="3" y="14" width="7" height="7" /></>} />;
const EP = [{ value: 'details', label: 'Details', icon: <Doc /> }, { value: 'team', label: 'Team', icon: <Users />, count: 5 }, { value: 'meetings', label: 'Meetings', icon: <Cal /> }];
const STEPS = [{ id: 'self', label: 'About you' }, { id: 'rate', label: 'Rate teammates' }, { id: 'notes', label: 'Notes' }, { id: 'review', label: 'Review' }];

function Phone() {
  const [tab, setTab] = React.useState('team');
  const [view, setView] = React.useState('table');
  return (
    <div className="col">
      <p className="lbl">Phone — 44px tabs (icon-only, names kept), full-width segmented, 44px chips, compact stepper</p>
      <Tabs idBase="ph" ariaLabel="Edit project" value={tab} onChange={setTab} tabs={EP} collapseOnPhone />
      <SegmentedControl ariaLabel="View" value={view} onChange={setView} options={[{ value: 'table', label: 'Table', icon: <Table /> }, { value: 'cards', label: 'Cards', icon: <Grid /> }]} />
      <FilterChipGroup type="single" size="sm" ariaLabel="Date range" value="30d" onChange={() => {}} options={[{ value: '7d', label: '7 days' }, { value: '30d', label: '30 days' }, { value: 'term', label: 'Term' }]} />
      <Stepper steps={STEPS} current={1} onStepClick={() => {}} />
    </div>
  );
}

function Demo() {
  const [tab, setTab] = React.useState('details');
  const [req, setReq] = React.useState('incoming');
  const [view, setView] = React.useState('table');
  const [unit, setUnit] = React.useState('tasks');
  const [scope, setScope] = React.useState('all');
  const [range, setRange] = React.useState('30d');
  const [kinds, setKinds] = React.useState(['ta', 'review']);
  const [step, setStep] = React.useState(2);
  const [page, setPage] = React.useState(3);
  return (
    <div className="st">
      <div className="sec">
        <p className="lbl">Tabs — grey track, stretch; ← → Home End (automatic activation); icons + count; disabled; hover / focus forced</p>
        <div className="col">
          <Tabs idBase="ep" ariaLabel="Edit project" value={tab} onChange={setTab} tabs={EP} />
          <TabPanel idBase="ep" value="details" active={tab === 'details'}><p className="note">Details panel (role="tabpanel", labelled by its tab)</p></TabPanel>
          <TabPanel idBase="ep" value="team" active={tab === 'team'}><p className="note">Team panel</p></TabPanel>
          <TabPanel idBase="ep" value="meetings" active={tab === 'meetings'}><p className="note">Meetings panel</p></TabPanel>
          <Tabs idBase="rq" ariaLabel="Requests" value={req} onChange={setReq} activation="manual" tabs={[{ value: 'incoming', label: 'Incoming', count: 3, countLabel: '3 incoming requests' }, { value: 'outgoing', label: 'Outgoing', count: 0 }, { value: 'archived', label: 'Archived', disabled: true }]} />
          <div className="gt-tabs" role="presentation"><span className="gt-tabs__tab gt-tabs__tab--active">Board</span><span className="gt-tabs__tab is-hover">Backlog (hover)</span><span className="gt-tabs__tab is-focus">Burnup (focus)</span></div>
          <div style={{ width: 200 }}><Tabs size="sm" idBase="mde" ariaLabel="Editor mode" value="write" onChange={() => {}} tabs={[{ value: 'write', label: 'Write' }, { value: 'preview', label: 'Preview' }]} /></div>
        </div>
      </div>

      <div className="sec">
        <p className="lbl">SegmentedControl — same track, sizes to its options (radio group: arrows move and select) · counts · sm · disabled option</p>
        <div className="row">
          <SegmentedControl ariaLabel="View" value={view} onChange={setView} options={[{ value: 'table', label: 'Table', icon: <Table /> }, { value: 'cards', label: 'Cards', icon: <Grid /> }]} />
          <SegmentedControl ariaLabel="Unit" size="sm" value={unit} onChange={setUnit} options={[{ value: 'tasks', label: 'Tasks' }, { value: 'points', label: 'Points' }, { value: 'hours', label: 'Hours', disabled: true }]} />
          <SegmentedControl ariaLabel="Scope" value="people" onChange={() => {}} options={[{ value: 'all', label: 'All', count: 24 }, { value: 'people', label: 'People', count: 9 }, { value: 'tasks', label: 'Tasks', count: 15 }]} />
        </div>
      </div>

      <div className="sec">
        <p className="lbl">FilterChip — single choice = radio group (palette scopes, analytics range) · multi = pressed toggles with a check (schedule kinds) · hover / focus / disabled</p>
        <div className="col">
          <FilterChipGroup type="single" size="sm" ariaLabel="Filter by type" value={scope} onChange={setScope} options={[{ value: 'all', label: 'All', count: 24 }, { value: 'people', label: 'People', count: 9 }, { value: 'projects', label: 'Projects', count: 3 }, { value: 'tasks', label: 'Tasks', count: 0, disabled: true }]} />
          <FilterChipGroup type="single" ariaLabel="Date range" value={range} onChange={setRange} options={[{ value: '7d', label: '7 days' }, { value: '30d', label: '30 days' }, { value: 'term', label: 'This term' }, { value: 'custom', label: 'Custom…' }]} />
          <FilterChipGroup size="sm" ariaLabel="Kinds" value={kinds} onChange={setKinds} options={[{ value: 'ta', label: 'TA meetings', count: 3 }, { value: 'review', label: 'Final reviews', count: 1 }, { value: 'lecture', label: 'Lectures', count: 6 }, { value: 'oh', label: 'Office hours', count: 4 }]} />
          <div className="row"><FilterChip className="is-hover">Hover</FilterChip><FilterChip className="is-focus">Focus</FilterChip><FilterChip disabled>Disabled</FilterChip><FilterChip size="sm" selected>Selected</FilterChip></div>
        </div>
      </div>

      <div className="sec">
        <p className="lbl">Stepper — done (button back) · current · upcoming (inert) · error; click a done step</p>
        <div className="col">
          <Stepper steps={STEPS} current={step} onStepClick={(id, i) => setStep(i)} />
          <Stepper steps={[{ id: 'a', label: 'About you' }, { id: 'b', label: 'Rate teammates', state: 'error' }, { id: 'c', label: 'Notes', state: 'current' }, { id: 'd', label: 'Review', state: 'upcoming' }]} current={2} onStepClick={() => {}} />
        </div>
      </div>

      <div className="sec grid2">
        <div>
          <p className="lbl">Pagination (kept; not ported until a screen needs it)</p>
          <Pagination page={page} pageCount={9} onChange={setPage} />
        </div>
        <div>
          <p className="lbl">Sidebar items (layout code) — unread is the shared UnreadBadge</p>
          <div style={{ background: 'var(--gt-primary)', borderRadius: 10, padding: '14px 14px 14px 19px', width: 230, overflow: 'hidden' }}>
            <SidebarSectionTitle>Main</SidebarSectionTitle>
            <SidebarNavItem icon={<Home />} label="Home" active />
            <SidebarNavItem icon={<Msg />} label="Messages" badge={3} />
            <SidebarNavItem icon={<Cal />} label="Schedule" />
          </div>
        </div>
      </div>

      <div className="sec">
        <p className="lbl">Phone width</p>
        <iframe className="phone" src="navigation.card.html?phone" height="380" title="Navigation at phone width" />
      </div>
    </div>
  );
}
if (PHONE) document.body.classList.add('is-phone');
ReactDOM.createRoot(document.getElementById('root')).render(PHONE ? <Phone /> : <Demo />);
</script>
</body>
</html>
