<!doctype html>
<html>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

<style>

<body>
<div id="root"></div>
<!-- Starts once the page is parsed: the deferred script below must be in the DOM before runDeferredBabel looks for it
     (with a bundle that already carries the round, the loader resolves at once). -->
<script>document.addEventListener('DOMContentLoaded', () => window.loadReleasesSources('../..').then(window.runDeferredBabel));</script>
<script type="text/babel-deferred">
const NS = window.GrepThinkDesignSystem_36e7e3;
const { LandingHeader, WhatsNewTab, Eyebrow, MarketingBadge, AnnouncementPill, Hero, FloatCard, Spotlight, Stage, StageCard,

const LOGO = '../../assets/grepthink-logo.svg';
const HEADER = new URLSearchParams(location.search).has('header');
const noop = () => {};
const WIDTHS = [[1280, 0.5], [768, 0.85], [560, 1], [400, 1], [375, 1], [320, 1]];

/* ?header: the four header states stacked — the bar and the pill, with and without the dot — framed at each width below */
function HeaderStates() {
  return (
    <div className="hs">
      <LandingHeader logoSrc={LOGO} fixed={false} onWhatsNew={noop} whatsNewUnseen />
      <LandingHeader logoSrc={LOGO} fixed={false} onWhatsNew={noop} />

      <LandingHeader logoSrc={LOGO} fixed={false} scrolled onWhatsNew={noop} />

}

const Scale = () => <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M4 9h16M4 15h16M10 3L8 21M16 3l-2 18"/></svg>;

function Demo() {
  const [contact, setContact] = React.useState({ name: '', email: '', message: '' });

    <div>

        <div className="wide">
          <Spotlight id="demo-scrum" eyebrow="Scrum board" badge="NEW" heading="Run every sprint from" headingAccent="one board"
            lead="Break your project into sprints, user stories and tasks. Drag work across the board, estimate it in points, and link each task to its pull request."
            bullets={[{ icon: <Move />, text: 'Drag-and-drop board with a history of every move' }, { icon: <Scale />, text: 'Story points and time estimates, on your team\'s own scale' }]}
            hairline>
            <Stage>
              <StageCard tilt={3} floatY={9} order={0} mobile style={{right: 24, top: 60, width: 262}}>
                <div style={{display:'flex', gap:6, alignItems:'center', marginBottom:8}}>

                  <polyline fill="none" stroke="#018156" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" points="0,78 33,70 66,58 100,44 133,36 166,28"/>
                </svg>
              </StageCard>
            </Stage>
          </Spotlight>
        </div>
      </div>

      <p className="lbl">ClosingBand · LandingFooter (compact)</p>
      <div className="frame">
        <ClosingBand text="Create a class and import your roster. Every team gets a scrum board and its own channels from day one." />

        </div>
        <div style={{flex: 1, minWidth: 320}}>
          <ContactCard subtitle="Questions about grepthink for your class? Send us a note." values={contact} onChange={setContact} onSubmit={() => {}} />
        </div>
      </div>
    </div>
  );
}
if (HEADER) document.body.classList.add('is-header');
ReactDOM.createRoot(document.getElementById('root')).render(HEADER ? <HeaderStates /> : <Demo />);
</script>
