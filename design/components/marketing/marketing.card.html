<!doctype html>
<html>

<script src="../../_ds_bundle.js"></script>
<style>

  .lbl:first-child { margin-top: 0; }
  .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .frame { border-radius: 12px; overflow: hidden; box-shadow: 0 0 0 1px var(--gt-gray-300); }

<body>
<div id="root"></div>
<script type="text/babel">

  const [contact, setContact] = React.useState({ name: '', email: '', message: '' });
  return (

      <div className="row" style={{marginTop: 10}}>

                  <polyline fill="none" stroke="#9aa0a6" strokeWidth="1.5" strokeDasharray="4 3" points="0,26 66,26 66,14 200,14"/>
                  <polyline fill="none" stroke="#018156" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" points="0,78 33,70 66,58 100,44 133,36 166,28"/>

        </div>
        <div style={{flex: 1, minWidth: 320}}>
          <ContactCard subtitle="Questions about grepthink for your class? Send us a note." values={contact} onChange={setContact} onSubmit={() => {}} />
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>

</html>
