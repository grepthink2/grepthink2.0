<!-- @dsCard group="Components" viewport="760x900" name="Primitives — Buttons" subtitle="Button (6 variants × default, hover, focus, pressed, disabled, busy), sizes, link, IconButton + tooltip, phone 44px" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="../gallery.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Button, IconButton } = window.GrepThinkDesignSystem_36e7e3;
const PHONE = new URLSearchParams(location.search).has('phone');
const I = ({ d, s = 16 }) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">{d}</svg>;
const Plus = () => <I d={<path d="M12 5v14M5 12h14" />} />;
const Trash = () => <I s={14} d={<><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" /></>} />;
const X = () => <I s={18} d={<path d="M18 6 6 18M6 6l12 12" />} />;
const More = () => <I d={<><circle cx="12" cy="12" r="1" /><circle cx="19" cy="12" r="1" /><circle cx="5" cy="12" r="1" /></>} />;
const Bold = () => <I s={14} d={<path d="M6 12h9a4 4 0 0 1 0 8H7a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h7a4 4 0 0 1 0 8" />} />;
const VARIANTS = [['primary', 'Save changes', 'Saving…'], ['secondary', 'Duplicate', 'Copying…'], ['outline', 'Cancel', 'Exporting…'], ['ghost', 'View all', 'Loading…'], ['danger', 'Delete', 'Deleting…'], ['danger-ghost', 'Remove', 'Removing…']];

function Phone() {
  const [pressed, setPressed] = React.useState(true);
  return (
    <div className="col">
      <p className="lbl">Phone (390px) — every button and icon button is ≥ 44px tall</p>
      <Button fullWidth size="lg">Sign in</Button>
      <div className="row"><Button variant="outline">Cancel</Button><Button>Save</Button><IconButton ariaLabel="More actions"><More /></IconButton></div>
      <div className="row"><Button size="sm" variant="danger-ghost" iconLeft={<Trash />}>Remove</Button><Button size="sm" variant="outline" pressed={pressed} onClick={() => setPressed(!pressed)}>Table</Button></div>
    </div>
  );
}

function Demo() {
  const [busy, setBusy] = React.useState(false);
  const [bold, setBold] = React.useState(false);
  return (
    <div className="st">
      <div className="sec">
        <p className="lbl">Button — variant × state (hover / focus forced for the gallery)</p>
        <div className="matrix">
          <span /><span className="h">Default</span><span className="h">Hover</span><span className="h">Focus</span><span className="h">Pressed</span><span className="h">Disabled</span><span className="h">Busy</span>
          {VARIANTS.map(([v, label, busyLabel]) => (
            <React.Fragment key={v}>
              <span className="h">{v}</span>
              <Button variant={v} size="sm">{label}</Button>
              <Button variant={v} size="sm" className="is-hover">{label}</Button>
              <Button variant={v} size="sm" className="is-focus">{label}</Button>
              {v === 'outline' || v === 'ghost' || v === 'secondary' ? <Button variant={v} size="sm" pressed>{label}</Button> : <span className="note">—</span>}
              <Button variant={v} size="sm" disabled>{label}</Button>
              <Button variant={v} size="sm" loading loadingLabel={busyLabel}>{label}</Button>
            </React.Fragment>
          ))}
        </div>
        <p className="note">Pressed exists for toggles (outline / ghost / secondary). Busy keeps focus (aria-disabled) and the width of the wider face.</p>
      </div>

      <div className="sec">
        <p className="lbl">Sizes sm 32 · md 40 · lg 48 — icons — link — live busy (width never changes)</p>
        <div className="row">
          <Button size="sm" iconLeft={<Plus />}>New project</Button>
          <Button iconLeft={<Plus />}>New project</Button>
          <Button size="lg">Sign in</Button>
          <Button href="#zoom" size="sm" variant="primary">Join Zoom</Button>
          <Button href="#browse" variant="outline">Browse projects</Button>
          <Button loading={busy} loadingLabel="Saving…" onClick={() => { setBusy(true); setTimeout(() => setBusy(false), 1600); }}>Save</Button>
        </div>
      </div>

      <div className="sec">
        <p className="lbl">IconButton — ghost / solid / danger × default, hover, focus, pressed, disabled; tooltip shows on hover and keyboard focus</p>
        <div className="row">
          {['ghost', 'solid', 'danger'].map((v) => (
            <React.Fragment key={v}>
              <IconButton variant={v} ariaLabel={v === 'danger' ? 'Delete' : 'More actions'}>{v === 'danger' ? <Trash /> : <More />}</IconButton>
              <IconButton variant={v} ariaLabel="Hover" className="is-hover" tooltip={false}>{v === 'danger' ? <Trash /> : <More />}</IconButton>
              <IconButton variant={v} ariaLabel="Focus" className="is-focus" tooltip={false}>{v === 'danger' ? <Trash /> : <More />}</IconButton>
            </React.Fragment>
          ))}
          <IconButton ariaLabel="Bold" size="sm" pressed={bold} onClick={() => setBold(!bold)}><Bold /></IconButton>
          <IconButton ariaLabel="Close" disabled><X /></IconButton>
          <IconButton ariaLabel="Close" size="sm"><X /></IconButton>
          <IconButton ariaLabel="Close"><X /></IconButton>
          <IconButton ariaLabel="Close" size="lg"><X /></IconButton>
        </div>
        <p className="note">Canonical names: "Close" (modal / drawer ×, md ghost) · "Dismiss" (alert, toast, banner) · "Remove {name}" (chip).</p>
      </div>

      <div className="sec">
        <p className="lbl">Phone width</p>
        <iframe className="phone" src="primitives.card.html?phone" height="250" title="Buttons at phone width" />
      </div>
    </div>
  );
}
if (PHONE) document.body.classList.add('is-phone');
ReactDOM.createRoot(document.getElementById('root')).render(PHONE ? <Phone /> : <Demo />);
</script>
</body>
</html>
