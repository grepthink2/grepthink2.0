<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; padding: 20px; background: var(--gt-gray-0); font-family: var(--gt-font-sans); }
  .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
  .lbl { font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--gt-gray-500); margin: 0 0 6px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Button, IconButton, Input, Textarea, Select, Checkbox, RadioGroup, Toggle, DatePickerField } = window.GrepThinkDesignSystem_36e7e3;

const X = () => (
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M18 6L6 18M6 6l12 12" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/></svg>
);
const Plus = () => (
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/></svg>
);

function Demo() {
  const [checked, setChecked] = React.useState(true);
  const [role, setRole] = React.useState('open');
  const [on, setOn] = React.useState(true);
  const [due, setDue] = React.useState(null);

  return (
    <div>
      <p className="lbl">Button — variants · loading · disabled</p>
      <div className="row">
        <Button variant="primary">Save changes</Button>
        <Button variant="secondary">Cancel</Button>
        <Button variant="ghost">View all</Button>
        <Button variant="danger">Remove</Button>
        <Button variant="primary" loading>Saving…</Button>
        <Button variant="primary" disabled>Disabled</Button>
        <Button variant="secondary" size="sm" iconLeft={<Plus />}>New project</Button>
        <IconButton ariaLabel="Close"><X /></IconButton>
      </div>

      <div className="cols">
        <div>
          <Input label="Project name" placeholder="e.g. GrepThink 2.0" required defaultValue="" />
        </div>
        <div>
          <Input label="Email" defaultValue="slug@gmail.com" error="Must be a @ucsc.edu address" />
        </div>
        <div>
          <Select label="Role" defaultValue="member" options={[
            {value:'owner',label:'Owner'},{value:'product_owner',label:'Product Owner'},
            {value:'scrum_master',label:'Scrum Master'},{value:'member',label:'Member'}]} />
        </div>
        <div>
          <DatePickerField label="Due date" value={due} onChange={setDue} />
        </div>
        <div>
          <Textarea label="What went well?" placeholder="Positive feedback for your teammate…" rows={2} maxLength={500} showCount defaultValue="" />
        </div>
        <div style={{display:'flex', flexDirection:'column', gap:12}}>
          <Checkbox label="Notify my team" description="Members get an email when this posts" checked={checked} onChange={e => setChecked(e.target.checked)} />
          <Toggle label="Dark mode" checked={on} onChange={e => setOn(e.target.checked)} />
          <RadioGroup inline value={role} onChange={setRole} options={[
            {value:'open',label:'Open'},{value:'invite',label:'Invite only'}]} />
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
