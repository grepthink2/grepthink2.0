<script type="text/babel">

const PHONE = new URLSearchParams(location.search).has('phone');
const MB = 1024 * 1024;
const MD = '**Bike Share Map** shows every campus dock with live availability.\n\n- Built with _React_ and `PostgreSQL`\n- Sponsor: [Transportation & Parking](https://taps.ucsc.edu)\n\nWe meet Tuesdays after section.';

function Phone() {
