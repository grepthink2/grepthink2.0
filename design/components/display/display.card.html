<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; padding: 20px; background: var(--gt-canvas); font-family: var(--gt-font-sans); }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .lbl { font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--gt-gray-500); margin: 0 0 6px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 14px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Badge, Tag, Avatar, AvatarGroup, Card, Table, StatCard, ProgressBar, Tooltip } = window.GrepThinkDesignSystem_36e7e3;

function Demo() {
  const [sort, setSort] = React.useState({ key: 'due', dir: 'asc' });
  const rows = [
    { id: 1, name: 'TSR1', due: 'Jan 18, 2026', status: <Badge tone="error">Due Soon</Badge> },
    { id: 2, name: 'TSR2', due: 'Jan 25, 2026', status: <Badge tone="neutral">Not Started</Badge> },
    { id: 3, name: 'TSR3', due: 'Feb 01, 2026', status: <Badge tone="success">Completed</Badge> },
  ];
  return (
    <div>
      <p className="lbl">Badges — status tones & role pills</p>
      <div className="row">
        <Badge tone="success">Submitted</Badge>
        <Badge tone="warning">Due soon</Badge>
        <Badge tone="error">Overdue</Badge>
        <Badge tone="info">In progress</Badge>
        <Badge tone="neutral">Not started</Badge>
        <Badge tone="gold">★ Team set</Badge>
        <Badge role="owner">Owner</Badge>
        <Badge role="product_owner">Product Owner</Badge>
        <Badge role="scrum_master">Scrum Master</Badge>
        <Badge role="member">Member</Badge>
      </div>

      <p className="lbl">Tags · Avatars · Tooltip · Progress</p>
      <div className="row">
        <Tag tone="green">React</Tag>
        <Tag tone="blue">TypeScript</Tag>
        <Tag onRemove={() => {}}>Supabase</Tag>
        <Avatar name="Ashton Liu" />
        <Avatar name="jdoe@ucsc.edu" size="sm" />
        <Avatar name="GrepThink 2.0" square />
        <AvatarGroup names={['Ashton Liu','Tony W','Landon N','Joshua C','Priya R','Sam K']} max={4} />
        <Tooltip content="Percent contribution this sprint"><Badge tone="info">25%</Badge></Tooltip>
        <div style={{width: 160}}><ProgressBar value={68} showLabel label="Sprint" /></div>
      </div>

      <p className="lbl">StatCards</p>
      <div className="grid3">
        <StatCard label="TSRs submitted" value="24/31" hint="7 outstanding" accent="primary"
          icon={<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 11l3 3L22 4" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/></svg>} />
        <StatCard label="Teams formed" value="8" hint="2 pending requests" accent="blue"
          icon={<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/><circle cx="9" cy="7" r="4" stroke="currentColor" strokeWidth="2"/></svg>} />
        <StatCard label="Unread messages" value="12" hint="3 conversations" accent="amber"
          icon={<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>} />
      </div>

      <p className="lbl">Card + Table (sortable, skeleton, empty)</p>
      <Card padded={false} shadow="hairline">
        <Table
          columns={[
            { key: 'name', label: 'Name', sortable: true },
            { key: 'due', label: 'Deadline', sortable: true },
            { key: 'status', label: 'Status' },
          ]}
          rows={rows}
          sort={sort}
          onSort={setSort}
        />
      </Card>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
