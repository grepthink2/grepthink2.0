<!-- @dsCard group="Components" viewport="760x1100" name="Display — Badges, avatars, meters" subtitle="Status colour map by area, categories, roles, CountBadge / UnreadBadge, Tag, Avatar (palette, decorative, fallback), ProgressBar + inline meter, Tooltip, InfoPopover" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="../gallery.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>.area { display: grid; grid-template-columns: 150px 1fr; gap: 6px 12px; align-items: center; } .area > span:nth-child(odd) { font-size: 11px; color: var(--gt-text-tertiary); }</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Badge, BADGE_STATUS, CountBadge, UnreadBadge, Tag, Avatar, AvatarGroup, AVATAR_COLORS, ProgressBar, Tooltip, InfoPopover, IconButton } = window.GrepThinkDesignSystem_36e7e3;
const AREAS = [['Assignment (staff)', 'assignment.active assignment.draft assignment.closed'], ['Assignment (student)', 'assignment.not_started assignment.in_progress assignment.submitted assignment.due_soon assignment.opens_later assignment.missed'], ['Class', 'class.active class.complete'], ['Project (browse)', 'project.open project.closed project.member'], ['Sprint', 'sprint.active sprint.planned sprint.completed'], ['Task', 'task.todo task.in_progress task.done task.blocked'], ['Pull request', 'pr.open pr.merged pr.closed pr.draft'], ['Attendance', 'attendance.present attendance.late attendance.absent attendance.unmarked'], ['TA meeting setup', 'meeting.weekly meeting.no_zoom'], ['Roster', 'roster.enrolled roster.waitlisted roster.dropped roster.not_on_roster roster.registered roster.not_registered'], ['Requests', 'request.incoming request.invitation request.pending request.denied'], ['Health · sentiment', 'health.excellent health.warning health.poor sentiment.positive sentiment.neutral sentiment.negative'], ['Live', 'live']];
const Bell = () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0" /></svg>;
const NAMES = ['Ashton Liu', 'Tony Wu', 'Landon Ng', 'Joshua Cruz', 'Priya Rao', 'Sam Kim'];

function Demo() {
  const [tags, setTags] = React.useState(['React', 'TypeScript', 'A very long skill name that truncates']);
  return (
    <div className="st">
      <div className="sec">
        <p className="lbl">Status colour rule — green done / positive · blue in progress / info · amber attention soon · red problem · grey not started / inactive (PRs keep GitHub's)</p>
        <div className="area">
          {AREAS.map(([name, keys]) => (
            <React.Fragment key={name}>
              <span>{name}</span>
              <span className="row" style={{ gap: 6 }}>{keys.split(' ').map((k) => <Badge key={k} status={k} />)}</span>
            </React.Fragment>
          ))}
        </div>
      </div>

      <div className="sec grid2">
        <div>
          <p className="lbl">Categories (not statuses) — outlined neutral + icon</p>
          <div className="row" style={{ gap: 6 }}>
            <Badge category="ta" /><Badge category="instructor" /><Badge category="team" /><Badge category="sponsored" /><Badge category="manual" /><Badge category="members">4 members</Badge>
          </div>
          <p className="lbl" style={{ marginTop: 14 }}>Project roles (projectRole — was role)</p>
          <div className="row" style={{ gap: 6 }}>
            <Badge projectRole="owner" /><Badge projectRole="product owner" /><Badge projectRole="scrum_master" /><Badge projectRole="admin" /><Badge projectRole="member" />
          </div>
          <p className="lbl" style={{ marginTop: 14 }}>Gold (achievements) · solid</p>
          <div className="row" style={{ gap: 6 }}><Badge tone="gold">★ Team set</Badge><Badge status="task.done" solid /><Badge status="task.blocked" solid /><Badge status="assignment.due_soon" solid /></div>
        </div>
        <div>
          <p className="lbl">CountBadge (neutral) · UnreadBadge (always red, "3 unread")</p>
          <div className="row" style={{ gap: 14 }}>
            <span className="row" style={{ gap: 6, fontSize: 13 }}>Past <CountBadge count={3} /></span>
            <CountBadge count={0} /><CountBadge count={128} />
            <UnreadBadge count={3} /><UnreadBadge count={120} />
            <span className="row" style={{ gap: 6, fontSize: 13 }}>Collapsed <UnreadBadge count={2} dot /></span>
            <button type="button" className="gt-icon-button gt-icon-button--ghost gt-icon-button--md" aria-label="Notifications, 8 unread" style={{ position: 'relative' }}><Bell /><UnreadBadge count={8} className="" /></button>
          </div>
          <p className="lbl" style={{ marginTop: 14 }}>Tag — neutral / green / blue · removable (× is a real button) · truncates</p>
          <div className="row" style={{ gap: 6, maxWidth: 340 }}>
            {tags.map((t) => <Tag key={t} tone="green" onRemove={() => setTags(tags.filter((x) => x !== t))}>{t}</Tag>)}
            <Tag>Neutral</Tag><Tag tone="blue">Frontend</Tag>
          </div>
        </div>
      </div>

      <div className="sec grid2">
        <div>
          <p className="lbl">Avatar — the one palette (6 slots, ≥ 4.5:1) · sizes · square · broken src → initials · group</p>
          <div className="row" style={{ gap: 6 }}>{AVATAR_COLORS.map((c, i) => <span key={c} className="gt-avatar gt-avatar--md" style={{ backgroundColor: c }}>{['AL', 'TW', 'LN', 'JC', 'PR', 'SK'][i]}</span>)}</div>
          <div className="row" style={{ marginTop: 10 }}>
            <Avatar name="Ana Ruiz" size="xs" /><Avatar name="Ana Ruiz" size="sm" /><Avatar name="Ana Ruiz" /><Avatar name="Ana Ruiz" size="lg" /><Avatar name="Ana Ruiz" size="xl" />
            <Avatar name="GrepThink 2.0" square /><Avatar name="Ben Okafor" src="missing-photo.jpg" />
            <AvatarGroup names={NAMES} max={4} />
          </div>
          <p className="note">Beside a visible name use <code>decorative</code>: <span className="row" style={{ display: 'inline-flex', gap: 6 }}><Avatar name="Cho Park" size="xs" decorative /> Cho Park</span></p>
        </div>
        <div>
          <p className="lbl">ProgressBar — progress · meter · inline 4px (decorative beside its number)</p>
          <div className="col">
            <ProgressBar value={68} label="Sprint 3" showLabel valueText="17 of 25 points" />
            <ProgressBar value={25} label="Contribution" meter showLabel tone="blue" size="sm" />
            <span className="row" style={{ fontSize: 13, gap: 8 }}>5 / 8 tasks <span style={{ width: 80 }}><ProgressBar inline decorative value={5} max={8} /></span></span>
          </div>
        </div>
      </div>

      <div className="sec">
        <p className="lbl">Tooltip (one line, hover / focus) · InfoPopover (explanations: click or Enter, Esc closes) · reason beside a disabled control</p>
        <div className="row" style={{ gap: 18, minHeight: 150, alignItems: 'flex-start', paddingTop: 30 }}>
          <Tooltip content="Percent contribution this sprint"><Badge tone="info">25%</Badge></Tooltip>
          <span className="row" style={{ gap: 2, fontSize: 12, fontWeight: 600, color: 'var(--gt-text-tertiary)', textTransform: 'uppercase', letterSpacing: '0.04em' }}>TSRs submitted<InfoPopover title="How TSRs are counted" label="About TSRs submitted" body="Reports submitted this sprint, out of everyone enrolled. Late submissions count." learnMoreHref="#tsr" /></span>
          <span className="row" style={{ gap: 4 }}><button type="button" className="gt-button gt-button--primary gt-button--sm" disabled>Publish</button><InfoPopover title="Why can't I publish?" body="Add at least one question before publishing the TSR." /></span>
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
