<body>
<div id="root"></div>
<script type="text/babel-deferred">
const NS = window.GrepThinkDesignSystem_36e7e3;
const { TeamMeetingsList, TeamMeetingForm } = NS;
const S = window.GT_TEAM_MEETINGS_SAMPLE;
const NOW = new Date(S.now), PT = 'America/Los_Angeles', IST = 'Asia/Kolkata';
const Card = ({ manage, children }) => <section className="card"><div className="card__head"><h3 className="card__title">Team meetings</h3>{manage && <a className="card__link" href="#">Manage</a>}</div>{children}</section>;
const noop = () => new Promise((r) => setTimeout(r, 600));

function Demo() {
  return (
    <div>
      <p className="lbl">TeamMeetingsList manage — the Meetings tab (Product Owner): upcoming first, live row, Past (3) collapsed</p>
      <div className="panel"><TeamMeetingsList variant="manage" meetings={S.meetings} canManage now={NOW} zone={PT} onCreate={noop} onUpdate={noop} onDelete={noop} /></div>

      <p className="lbl">One editor at a time — a row in edit (others disabled) · a row waiting on its delete confirm</p>
      <div className="panel"><TeamMeetingsList variant="manage" meetings={S.upcoming} canManage now={NOW} zone={PT} defaultEditingId="tm-2" defaultConfirmId="tm-3" onCreate={noop} onUpdate={noop} onDelete={noop} /></div>

      <p className="lbl">Empty · Loading · Error · 8+ meetings with a long title (past open)</p>
      <div className="cols">
        <div className="panel"><TeamMeetingsList variant="manage" meetings={[]} canManage now={NOW} zone={PT} /></div>
        <div className="panel"><TeamMeetingsList variant="manage" status="loading" now={NOW} /></div>
        <div className="panel"><TeamMeetingsList variant="manage" status="error" now={NOW} onRetry={() => {}} /></div>
        <div className="panel"><TeamMeetingsList variant="manage" meetings={S.many} canManage now={NOW} zone={PT} defaultPastOpen /></div>
      </div>

      <p className="lbl">TeamMeetingForm — new (viewer in IST: campus time under the field) · edit with a save error (draft kept) · saving</p>
      <div className="cols">
        <div className="panel"><TeamMeetingForm mode="create" now={NOW} zone={IST} onSubmit={() => {}} onCancel={() => {}} /></div>
        <div className="panel"><TeamMeetingForm mode="edit" meeting={S.upcoming[2]} now={NOW} zone={PT} error="Couldn’t save this meeting. Your changes are still here — try again." onSubmit={() => {}} onCancel={() => {}} /></div>
        <div className="panel"><TeamMeetingForm mode="edit" meeting={S.upcoming[1]} now={NOW} zone={PT} saving onSubmit={() => {}} onCancel={() => {}} /></div>
      </div>

      <p className="lbl">TeamMeetingsList card — the project page: compact ScheduleItem rows by day (live → Join Zoom), Past meetings (3) · past open · empty for the Product Owner · viewer in IST</p>
      <div className="cols">
        <Card manage><TeamMeetingsList variant="card" meetings={S.meetings} teamName={S.teamName} people={S.people} canManage now={NOW} zone={PT} /></Card>
        <Card><TeamMeetingsList variant="card" meetings={S.meetings} teamName={S.teamName} people={S.people} now={NOW} zone={PT} defaultPastOpen /></Card>
        <Card manage><TeamMeetingsList variant="card" meetings={[]} canManage now={NOW} zone={PT} onManage={() => {}} /></Card>
        <Card><TeamMeetingsList variant="card" meetings={S.meetings} teamName={S.teamName} people={S.people} now={NOW} zone={IST} /></Card>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
<script>loadTeamMeetingSources('../..').then(runDeferredBabel);</script>
