<html>

<link rel="stylesheet" href="../../styles.css">

<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; padding: 20px; background: var(--gt-canvas); font-family: var(--gt-font-sans); }
  .lbl { font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--gt-gray-500); margin: 0 0 8px; }
  .demo .gt-toast-stack { position: static; }
  .cap { font-size: 10.5px; color: var(--gt-gray-600); margin: 10px 0 0; line-height: 1.5; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { ToastStack } = window.GrepThinkDesignSystem_36e7e3;
const noop = () => {};

function Demo() {
  return (
    <div className="demo">
      <p className="lbl">The board's real cases — error + action (sticky), success (5s), neutral (info pair)</p>
      <ToastStack
        toasts={[
          { id: 1, variant: 'error', message: "Couldn't move GT-12 — dropped back to To do.", actionLabel: 'Undo', onAction: noop, duration: 0 },
          { id: 2, variant: 'success', message: 'Repository saved', duration: 0 },
          { id: 3, variant: 'neutral', message: 'Read-only preview — changes are disabled', duration: 0 },
        ]}
        onDismiss={noop}
      />
      <p className="cap">Auto-dismiss 5s · errors 8s · error with an action stays until handled. Enter = rise-in, exit = fade (opacity only under reduced motion). Inline, non-floating notices stay on <code style={{fontFamily: 'var(--gt-font-mono)', fontSize: 10}}>Alert</code>.</p>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
