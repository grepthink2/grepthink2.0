<!-- @dsCard group="Components" viewport="760x1040" name="Feedback — Alerts, empty states, loading" subtitle="Alert (4 tones, actions, dismiss), EmptyState (page, card, quiet, error) + NoClassSelected, Spinner 14–24, Skeleton; phone" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="../gallery.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Alert, EmptyState, NoClassSelected, Spinner, Skeleton, Button } = window.GrepThinkDesignSystem_36e7e3;
const PHONE = new URLSearchParams(location.search).has('phone');
const Folder = () => <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z" /></svg>;
const Chart = () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M3 3v18h18M18 17V9M13 17V5M8 17v-3" /></svg>;

function Phone() {
  return (
    <div className="col">
      <p className="lbl">Phone — dismiss × and actions are 44px</p>
      <Alert tone="error" title="Couldn't save this meeting." onDismiss={() => {}} actions={<Button size="sm" variant="outline">Try again</Button>}>Your changes are still here.</Alert>
      <NoClassSelected onSelectClass={() => {}} />
    </div>
  );
}

function Demo() {
  const [shown, setShown] = React.useState(true);
  return (
    <div className="st">
      <div className="sec">
        <p className="lbl">Alert — success · info · warning · error (role="alert") · with actions · dismissible</p>
        <div className="grid2">
          <Alert tone="success" title="Roster imported">62 students added, 3 skipped.</Alert>
          <Alert tone="info">Preview mode — students can't see changes yet.</Alert>
          <Alert tone="warning" title="You have an unsent draft" actions={<><Button size="sm" variant="outline">Restore draft</Button><Button size="sm" variant="danger-ghost">Discard</Button></>} />
          <Alert tone="error" title="Couldn't save this meeting." actions={<Button size="sm" variant="outline">Try again</Button>}>Your changes are still here.</Alert>
          {shown ? <Alert tone="info" onDismiss={() => setShown(false)} title="Dismissible">The × is "Dismiss".</Alert> : <Button size="sm" variant="outline" onClick={() => setShown(true)}>Show the dismissible alert again</Button>}
          <Alert tone="warning" title="Message failed to send" actions={<><Button size="sm" variant="outline">Retry</Button><Button size="sm" variant="danger-ghost">Unsend</Button></>}><p>Check your connection.</p><p>The draft stays in the composer.</p></Alert>
        </div>
      </div>

      <div className="sec">
        <p className="lbl">EmptyState — page · card (inside a card / table) · quiet · error (never a red panel)</p>
        <div className="grid2">
          <div className="panel"><EmptyState icon={<Folder />} title="No projects yet" description="Projects your class creates appear here." action={<Button>Create project</Button>} titleAs="h2" /></div>
          <div className="col">
            <div className="panel" style={{ padding: 0 }}><EmptyState variant="card" icon={<Chart />} title="No messages in this range" description="Try a longer range." /></div>
            <div className="panel"><EmptyState variant="quiet" title="No upcoming meetings." description="Past meetings stay below." /></div>
            <div className="panel"><EmptyState variant="error" title="Couldn't load team meetings." onRetry={() => {}} /></div>
          </div>
        </div>
      </div>

      <div className="sec">
        <p className="lbl">"No class selected" — written once for the 14 class-scoped pages (page and card)</p>
        <div className="grid2">
          <div className="panel"><NoClassSelected onSelectClass={() => {}} /></div>
          <div className="panel" style={{ padding: 0 }}><NoClassSelected variant="card" titleAs="h3" onSelectClass={() => {}} /></div>
        </div>
      </div>

      <div className="sec grid2">
        <div>
          <p className="lbl">Spinner — 14 · 16 · 20 · 24 (role="status", label for screen readers)</p>
          <div className="row" style={{ color: 'var(--gt-primary)', gap: 18 }}>
            <Spinner size={14} /><Spinner size={16} /><Spinner size={20} /><Spinner size={24} label="Loading analytics" />
            <span className="row" style={{ gap: 8, color: 'var(--gt-text-tertiary)', fontSize: 12.5 }}><Spinner size={14} decorative />Loading more…</span>
          </div>
          <p className="note">Reduced motion: keeps turning at 1.6s (!important beats the global kill switch).</p>
        </div>
        <div>
          <p className="lbl">Skeleton — when the shape of the content is known</p>
          <div className="panel col" style={{ gap: 8 }} aria-busy="true">
            <div className="row" style={{ gap: 10 }}><Skeleton circle width={28} height={28} /><div style={{ flex: 1 }} className="col"><Skeleton width="60%" height={12} /><Skeleton width="85%" height={10} /></div></div>
            <div className="row" style={{ gap: 10 }}><Skeleton circle width={28} height={28} /><div style={{ flex: 1 }} className="col"><Skeleton width="45%" height={12} /><Skeleton width="70%" height={10} /></div></div>
          </div>
        </div>
      </div>

      <div className="sec">
        <p className="lbl">Phone width</p>
        <iframe className="phone" src="feedback.card.html?phone" height="460" title="Feedback at phone width" />
      </div>
    </div>
  );
}
if (PHONE) document.body.classList.add('is-phone');
ReactDOM.createRoot(document.getElementById('root')).render(PHONE ? <Phone /> : <Demo />);
</script>
</body>
</html>
