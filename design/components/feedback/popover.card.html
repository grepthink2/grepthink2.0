<!-- @dsCard group="Components" viewport="700x1280" name="Popover & Menu family" subtitle="Popover, Menu, MentionListbox + the three board compositions (mention autocomplete, board settings, overflow menu)" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; padding: 20px; background: var(--gt-canvas); font-family: var(--gt-font-sans); }
  .lbl { font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--gt-gray-500); margin: 20px 0 8px; }
  .lbl:first-child { margin-top: 0; }
  .cap { font-size: 10.5px; color: var(--gt-gray-600); margin: 6px 0 0; line-height: 1.5; }
  .seclbl { display: block; font-size: 9.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--gt-gray-500); margin: 12px 0 6px; }
  .seclbl:first-child { margin-top: 0; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const NS = window.GrepThinkDesignSystem_36e7e3;
const { Popover, Menu, MenuItem, MenuSeparator, MentionListbox, IconButton, Button, TaskCard } = NS;
const noop = () => {};

const Pencil = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M17 3a2.85 2.83 0 114 4L7.5 20.5 2 22l1.5-5.5z" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>;
const LinkIc = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>;
const Trash = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>;
const UserIc = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/><circle cx="12" cy="7" r="4" stroke="currentColor" strokeWidth="2"/></svg>;
const Gear = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="3" stroke="currentColor" strokeWidth="2"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>;
const Branch = () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 3v12M18 9a3 3 0 100-6 3 3 0 000 6zM6 21a3 3 0 100-6 3 3 0 000 6z" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/><path d="M18 9a9 9 0 01-9 9" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/></svg>;
const More = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="5" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="19" cy="12" r="1.6" fill="currentColor"/></svg>;
const X = () => <svg width="13" height="13" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/></svg>;

const members = [
  { id: 1, name: 'Tony Wu', secondary: 'Scrum master' },
  { id: 2, name: 'Antonio Reyes', secondary: 'areyes@ucsc.edu' },
  { id: 3, name: 'Ashton Liu', secondary: 'Product owner' },
];

const repoInput = { border: '1px solid var(--gt-border)', borderRadius: 7, padding: '6px 9px', fontFamily: 'var(--gt-font-sans)', fontSize: 11.5, color: 'var(--gt-gray-800)', outline: 'none', minWidth: 0 };
const tokenChip = { display: 'inline-flex', alignItems: 'center', padding: '1px 7px', borderRadius: 999, background: 'var(--gt-success-soft)', color: 'var(--gt-success-text)', fontSize: 9.5, fontWeight: 600, whiteSpace: 'nowrap' };

function Demo() {
  return (
    <div>
      <p className="lbl">Placements — below / above, 6px offset</p>
      <div style={{display: 'flex', gap: 140, alignItems: 'flex-start', paddingBottom: 96}}>
        <Popover open onClose={noop} placement="bottom" align="start" anchor={<Button variant="secondary" size="sm">Below · start</Button>} style={{width: 200}}>
          <div style={{fontSize: 12.5, color: 'var(--gt-gray-800)', lineHeight: 1.5}}>White · 1px border · radius 10 · pop shadow.</div>
        </Popover>
        <div style={{paddingTop: 76}}>
          <Popover open onClose={noop} placement="top" align="start" size="sm" anchor={<Button variant="secondary" size="sm">Above · sm</Button>} style={{width: 170}}>
            <div style={{fontSize: 11.5, color: 'var(--gt-gray-800)'}}>size="sm" — radius 7, tighter padding.</div>
          </Popover>
        </div>
      </div>

      <p className="lbl">Menu anatomy — 32px rows, icon + shortcut, destructive, disabled</p>
      <div className="gt-popover gt-popover--flush" style={{position: 'static', display: 'inline-block', width: 210}}>
        <Menu ariaLabel="Example menu">
          <MenuItem icon={<Pencil />} shortcut="⌘E" onSelect={noop}>Edit</MenuItem>
          <MenuItem icon={<LinkIc />} shortcut="⌘C" onSelect={noop}>Copy link</MenuItem>
          <MenuItem icon={<UserIc />} disabled>Reassign…</MenuItem>
          <MenuSeparator />
          <MenuItem icon={<Trash />} destructive onSelect={noop}>Delete</MenuItem>
        </Menu>
      </div>

      <p className="lbl">Composition 1 — @mention over the comment composer</p>
      <div style={{background: '#fff', borderRadius: 10, padding: 14, boxShadow: 'var(--gt-shadow-hairline)'}}>
        <div style={{position: 'relative', paddingTop: 118}}>
          <MentionListbox open query="to" members={members} activeIndex={0} position="above" onSelect={noop} style={{bottom: 'auto', top: 0}} />
          <textarea className="gt-comments__input" rows="2" defaultValue="Blocked on the RLS policy — @to" aria-label="Comment"></textarea>
        </div>
        <p className="cap">Focus stays in the textarea; ↑/↓ move the active row via aria-activedescendant, Enter/Tab insert, Esc dismisses. Async lookups debounce 250ms.</p>
        <div style={{display: 'flex', gap: 10, marginTop: 10, flexWrap: 'wrap'}}>
          {['idle', 'loading', 'empty', 'error'].map((s) => (
            <div key={s} style={{flex: '1 1 140px'}}>
              <span className="seclbl">{s}</span>
              <MentionListbox stateOverride={s} query="zzz" style={{position: 'static'}} />
            </div>
          ))}
        </div>
      </div>

      <p className="lbl">Composition 2 — board settings (replaces the interim settings modal)</p>
      <div style={{display: 'flex', justifyContent: 'flex-end', paddingBottom: 320}}>
        <Popover open onClose={noop} placement="bottom" align="end" anchor={<IconButton ariaLabel="Board settings"><Gear /></IconButton>} style={{width: 330}}>
          <div style={{fontSize: 13, fontWeight: 600, color: 'var(--gt-gray-800)', marginBottom: 10}}>Board settings</div>
          <span className="seclbl">Estimate scale</span>
          <div className="gt-pointpicker">
            <button type="button" className="gt-pointpicker__chip" style={{width: 'auto', padding: '0 10px'}}>linear</button>
            <button type="button" className="gt-pointpicker__chip" style={{width: 'auto', padding: '0 10px'}}>exponential</button>
            <button type="button" className="gt-pointpicker__chip gt-pointpicker__chip--active" style={{width: 'auto', padding: '0 10px'}}>fibonacci</button>
          </div>
          <span className="seclbl">Repositories</span>
          <div style={{display: 'flex', flexDirection: 'column', gap: 6}}>
            {[['github.com/grepthink2/grepthink2.0', true], ['git.ucsc.edu/cse115/team1', false]].map(([url, tok]) => (
              <div key={url} style={{display: 'flex', alignItems: 'center', gap: 7}}>
                <span style={{color: 'var(--gt-gray-600)', display: 'inline-flex', flexShrink: 0}}><Branch /></span>
                <span style={{fontFamily: 'var(--gt-font-mono)', fontSize: 10.5, color: 'var(--gt-gray-700)', flex: 1, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis'}}>{url}</span>
                {tok && <span style={tokenChip}>token set</span>}
                <IconButton ariaLabel={`Remove ${url}`} size="sm"><X /></IconButton>
              </div>
            ))}
            <div style={{display: 'flex', gap: 6, marginTop: 4}}>
              <input style={{...repoInput, flex: 2, fontFamily: 'var(--gt-font-mono)', fontSize: 10.5}} placeholder="https://git.ucsc.edu/…" aria-label="Repository URL" />
              <input type="password" style={{...repoInput, flex: 1}} placeholder="Access token" aria-label="Access token" />
              <Button size="sm" variant="secondary">Add</Button>
            </div>
          </div>
        </Popover>
      </div>

      <p className="lbl">Composition 3 — overflow menu on a task card</p>
      <div style={{display: 'flex', gap: 16, alignItems: 'flex-start', paddingBottom: 60}}>
        <div style={{position: 'relative', width: 270}}>
          <TaskCard taskKey="GT-12" storyKey="GT-4" title="Wire the drag-and-drop audit trail" tags={['frontend']} points={3}
            reporter="Ashton Liu" assignee="Tony Wu" />
          <div style={{position: 'absolute', top: 6, right: 6}}>
            <Popover open onClose={noop} placement="bottom" align="end" padded={false} anchor={<IconButton ariaLabel="Task actions" size="sm"><More /></IconButton>}>
              <Menu ariaLabel="Task actions">
                <MenuItem icon={<Pencil />} onSelect={noop}>Edit</MenuItem>
                <MenuItem icon={<LinkIc />} onSelect={noop}>Copy link</MenuItem>
                <MenuSeparator />
                <MenuItem icon={<Trash />} destructive onSelect={noop}>Delete</MenuItem>
              </Menu>
            </Popover>
          </div>
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
