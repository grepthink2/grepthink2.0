<!-- @dsCard group="GrepThink App" viewport="1280x800" name="Schedule — Today's card & agenda week" subtitle="Student Home with the Today's Schedule card, the /app/schedule agenda, every state, Student · TA · Instructor lenses, another time zone, phone" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>GrepThink — Schedule</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="../../components/schedule/scheduleData.js"></script>
<script src="../../components/schedule/scheduleSrcLoader.js"></script>
<style>
  html, body { margin: 0; height: 100%; }
  body { font-family: var(--gt-font-sans); background: var(--gt-gray-100); color: var(--gt-text-primary); }
  a { color: var(--gt-text-link); } a:hover { color: var(--gt-info-text); }
  .sch-stage { height: 100vh; }
  .sch-app { display: flex; height: 100%; }
  .sch-side { width: 256px; flex-shrink: 0; background: var(--gt-green-500); display: flex; flex-direction: column; padding: 0.875rem 1.2rem; box-sizing: border-box; }
  .sch-side__logo { width: 170px; filter: brightness(0) invert(1); margin-bottom: 0.75rem; }
  .sch-class { display: flex; align-items: center; gap: 8px; margin: 0 0 0.875rem; background: var(--gt-gray-100); color: var(--gt-gray-900); border: none; border-radius: 8px; padding: 0.625rem 0.875rem; font-family: var(--gt-font-sans); font-size: 0.8125rem; font-weight: 500; text-align: left; cursor: pointer; }
  .sch-class span:last-child { margin-left: auto; opacity: .6; }
  .sch-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .sch-header { display: flex; align-items: center; gap: 16px; height: 64px; padding: 0 24px; background: var(--gt-surface); border-bottom: 1px solid var(--gt-border); box-sizing: border-box; flex-shrink: 0; }
  .sch-header__title { margin: 0; font-size: 20px; font-weight: 600; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sch-header__right { display: flex; align-items: center; gap: 12px; }
  .sch-header__icon, .sch-header__menu { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border: none; border-radius: var(--gt-radius-sm); background: var(--gt-surface); box-shadow: var(--gt-shadow-card); color: var(--gt-text-secondary); cursor: pointer; }
  .sch-header__menu { box-shadow: none; }
  .sch-content { flex: 1; overflow: auto; padding: 20px 24px 60px; container-type: inline-size; }
  /* Student Home (mirrors .student-home) */
  .sch-home__welcome { margin: 0 0 16px; font-size: 32px; font-weight: 600; line-height: 1.2; }
  .sch-home__grid { display: grid; grid-template-columns: minmax(0, 2fr) minmax(300px, 1fr); gap: 24px; align-items: start; }
  @container (max-width: 680px) { .sch-home__grid { grid-template-columns: 1fr; } }
  .sch-home__col { display: flex; flex-direction: column; gap: 24px; min-width: 0; }
  .sch-card { background: var(--gt-surface); border-radius: var(--gt-radius-md); box-shadow: var(--gt-shadow-card); padding: 20px 24px; }
  .sch-card__head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 6px; }
  .sch-card__head a { white-space: nowrap; font-size: 12px; font-weight: 500; }
  .sch-card__title { margin: 0; font-size: 16px; font-weight: 600; white-space: nowrap; }
  .sch-card__date { font-size: 12px; color: var(--gt-text-tertiary); white-space: nowrap; }
  .sch-row { display: grid; grid-template-columns: 1fr auto auto; gap: 12px; align-items: center; padding: 11px 0; border-top: 1px solid var(--gt-border-subtle); font-size: 13px; }
  .sch-row:first-of-type { border-top: none; }
  .sch-row__name { font-weight: 500; }
  .sch-row__meta { color: var(--gt-text-tertiary); font-size: 12px; }
  .sch-toolbar { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .sch-toolbar__btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12.5px 8px; border: none; border-radius: var(--gt-radius-sm); font-family: var(--gt-font-sans); font-size: 14px; font-weight: 600; color: #fff; cursor: pointer; white-space: nowrap; }
  .sch-toolbar__btn--join { background: var(--gt-accent); } .sch-toolbar__btn--messages { background: var(--gt-purple); } .sch-toolbar__btn--browse { background: var(--gt-primary); }
  .sch-team { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
  .sch-team li { display: flex; align-items: center; gap: 12px; font-size: 13px; }
  .sch-team small { display: block; color: var(--gt-text-tertiary); font-size: 12px; }
  /* states grid */
  .sch-states { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 20px; align-items: start; }
  .sch-states__lbl { grid-column: 1 / -1; margin: 8px 0 -8px; font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--gt-gray-500); }
  .sch-states__wide { grid-column: 1 / -1; }
  .sch-caption { margin: 0 0 8px; font-size: 11.5px; color: var(--gt-text-tertiary); }
  /* phone frames */
  .sch-stage--phone { display: flex; align-items: flex-start; justify-content: center; gap: 24px; padding: 24px 0; box-sizing: border-box; }
  .sch-stage--phone .sch-app { width: 390px; height: calc(100vh - 48px); border: 1px solid var(--gt-border); border-radius: 20px; overflow: hidden; background: var(--gt-gray-100); box-shadow: var(--gt-shadow-pop); position: relative; container-type: inline-size; }
  .sch-stage--phone .sch-header { padding: 0 12px; gap: 8px; }
  .sch-stage--phone .sch-content { padding: 16px 12px 40px; }
  .sch-stage--phone .sch-home__welcome { font-size: 24px; }
  .sch-stage--phone .sch-home__grid { grid-template-columns: 1fr; gap: 16px; }
  .sch-stage--phone .sch-card { padding: 16px; }
  @media (max-width: 900px) { .sch-home__grid { grid-template-columns: 1fr; } }
  /* phone frame: the schedule layer's < 768px rules, scoped to the 390px frame (kit-only; production gets them from the media query) */
  .sch-stage--phone .gt-sched--agenda .gt-sched-item { grid-template-columns: 64px 24px minmax(0, 1fr); row-gap: 8px; padding: 10px 12px; }
  .sch-stage--phone .gt-sched--agenda .gt-sched-item__range { display: none; }
  .sch-stage--phone .gt-sched--agenda .gt-sched-item__start { display: block; font-size: 12.5px; }
  .sch-stage--phone .gt-sched--agenda .gt-sched-item__tile { width: 24px; height: 24px; }
  .sch-stage--phone .gt-sched--agenda .gt-sched-item__actions { grid-column: 2 / -1; justify-self: stretch; }
  .sch-stage--phone .gt-sched--agenda .gt-sched-item__action { flex: 1; min-height: 44px; }
  .sch-stage--phone .gt-sched--agenda .gt-sched-item__toggle { min-width: 44px; min-height: 44px; }
  .sch-stage--phone .gt-sched--agenda .gt-sched__now { grid-template-columns: 64px 1fr; padding: 2px 12px; }
  .sch-stage--phone .gt-sched--agenda .gt-sched-day, .sch-stage--phone .gt-sched--agenda .gt-sched-divider, .sch-stage--phone .gt-sched--agenda .gt-sched__skeleton, .sch-stage--phone .gt-sched--agenda .gt-sched-day__empty { padding-left: 12px; padding-right: 12px; }
  .sch-stage--phone .gt-sched--compact .gt-sched-item__action { min-height: 44px; }
  .sch-stage--phone .gt-sched__toolbar { gap: 10px; }
  .sch-stage--phone .gt-sched__week { width: 100%; justify-content: space-between; }
  .sch-stage--phone .gt-sched__week-btn { min-width: 44px; min-height: 44px; }
  .sch-stage--phone .gt-sched__week-cur { min-height: 44px; }
  .sch-stage--phone .gt-sched__filters { margin-left: 0; width: 100%; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .sch-stage--phone .gt-sched__chip { min-height: 32px; }
  /* demo bar (kit-only) */
  .sch-demo { position: fixed; right: 16px; bottom: 16px; display: flex; align-items: center; gap: 10px; padding: 4px 6px 4px 10px; background: var(--gt-gray-900); color: #fff; border-radius: 999px; font-size: 11px; box-shadow: 0 4px 12px rgba(0,0,0,.25); z-index: 200; flex-wrap: wrap; max-width: calc(100vw - 32px); }
  .sch-demo__group { display: inline-flex; align-items: center; gap: 2px; }
  .sch-demo__lbl { opacity: .6; margin-right: 4px; text-transform: uppercase; letter-spacing: .05em; font-size: 9.5px; }
  .sch-demo__opt { border: none; background: transparent; color: #fff; font: inherit; padding: 5px 9px; border-radius: 999px; cursor: pointer; opacity: .7; }
  .sch-demo__opt:hover { opacity: 1; }
  .sch-demo__opt[aria-pressed="true"] { background: var(--gt-green-500); opacity: 1; }
  .sch-demo__opt:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--gt-blue-500); }
  .sch-demo__log { font-family: var(--gt-font-mono); opacity: .85; padding-right: 6px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
(async () => {
  await loadScheduleSources('../..');
  const src = await (await fetch('./ScheduleScreen.jsx')).text();
  new Function(Babel.transform(src, { presets: ['react'] }).code)();
  ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(window.ScheduleApp));
})();
</script>
</body>
</html>
