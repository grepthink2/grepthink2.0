<!-- @dsCard group="GrepThink App" viewport="1280x800" name="What's new — release notes" subtitle="The What's new modal (dark on the landing page, light in the app), the landing header's ⓘ tab and the profile menu on the kit; demo bar: context, header state, width, seen state, persona" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>GrepThink — What's new</title>
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="../../frontend/src/index.css"> <!-- the app's base styles, so the screens render like the app -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="../../components/releases/releasesData.js"></script>
<script src="../../components/releases/releasesSrcLoader.js"></script>
<style>
  html, body { margin: 0; height: 100%; }
  body { font-family: var(--gt-font-sans); background: var(--gt-gray-100); color: var(--gt-text-primary); }
  a { color: var(--gt-text-link); } a:hover { color: var(--gt-info-text); }
  /* the shell: a stage that holds the composition at the chosen width, and the demo bar */
  .wn-shell { min-height: 100%; display: flex; justify-content: center; align-items: stretch; background: var(--gt-gray-200); }
  .wn-shell__frame { display: block; border: 0; height: 100vh; max-width: 100%; background: var(--gt-gray-100); box-shadow: 0 0 0 1px var(--gt-gray-300); transition: width var(--gt-transition-medium); }
  /* the landing page under the fixed header */
  .wn-landing { min-height: 100%; background: var(--gt-canvas); }
  .wn-landing__band { max-width: 1100px; margin: 0 auto; padding: 40px 24px 80px; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 24px; }
  /* the app shell (mirrors the layout SCSS: green sidebar, 64px white header, canvas content) */
  .wn-app { display: flex; height: 100vh; }
  .wn-side { width: 256px; flex-shrink: 0; background: var(--gt-green-500); display: flex; flex-direction: column; padding: 0.875rem 1.2rem; box-sizing: border-box; }
  .wn-side__logo { width: 170px; filter: brightness(0) invert(1); margin-bottom: 0.75rem; }
  .wn-class { display: flex; align-items: center; gap: 8px; margin: 0 0 0.875rem; background: var(--gt-gray-100); color: var(--gt-gray-900); border: none; border-radius: 8px; padding: 0.625rem 0.875rem; font-family: var(--gt-font-sans); font-size: 0.8125rem; font-weight: 500; text-align: left; cursor: pointer; }
  .wn-class span:last-child { margin-left: auto; opacity: .6; }
  .wn-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .wn-header { display: flex; align-items: center; gap: 16px; height: 64px; padding: 0 24px; background: var(--gt-surface); box-sizing: border-box; flex-shrink: 0; position: sticky; top: 0; z-index: var(--gt-z-dropdown); }
  .wn-header__title { margin: 0; font-size: 20px; font-weight: 600; color: var(--gt-text-secondary); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wn-header__right { display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
  .wn-header__icon, .wn-header__menu { position: relative; display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border: none; border-radius: var(--gt-radius-sm); background: var(--gt-surface); box-shadow: var(--gt-shadow-card); color: var(--gt-text-secondary); cursor: pointer; }
  .wn-header__menu { display: none; box-shadow: none; }
  .wn-header__search { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; border: none; border-radius: var(--gt-radius-sm); background: var(--gt-surface); box-shadow: var(--gt-shadow-card); color: var(--gt-text-secondary); font-family: var(--gt-font-sans); font-size: 12.5px; cursor: pointer; }
  .wn-header__search kbd { font-family: var(--gt-font-mono); font-size: 10.5px; color: var(--gt-text-tertiary); }
  .wn-content { flex: 1; overflow: auto; padding: 20px 24px 60px; }
  .wn-content__welcome { margin: 0 0 16px; font-size: 32px; font-weight: 600; line-height: 1.2; }
  .wn-content__grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 24px; align-items: start; }
  .wn-card { background: var(--gt-surface); border-radius: var(--gt-radius-md); box-shadow: var(--gt-shadow-card); padding: 20px 24px; }
  .wn-card h2 { margin: 0 0 6px; font-size: 16px; font-weight: 600; }
  .wn-card p { margin: 0; font-size: 13px; color: var(--gt-text-tertiary); line-height: 1.5; }
  .wn-banner { display: flex; align-items: center; gap: 10px; padding: 10px 24px; background: var(--gt-warning-soft); color: var(--gt-warning-text); font-size: 13px; font-weight: 500; }
  @media (max-width: 768px) {
    .wn-side { display: none; }
    .wn-header { padding: 0 12px; gap: 8px; }
    .wn-header__menu { display: inline-flex; flex-shrink: 0; }
    .wn-header__right { gap: 8px; }
    .wn-header__search span { display: none; }
    .wn-header__search { width: 40px; padding: 0; justify-content: center; }
    .wn-content { padding: 16px 12px 40px; }
    .wn-content__welcome { font-size: 24px; }
  }
  /* demo bar (kit-only) */
  .wn-demo { position: fixed; right: 16px; bottom: 16px; display: flex; align-items: center; gap: 10px; padding: 4px 6px 4px 10px; background: var(--gt-gray-900); color: #fff; border-radius: 999px; font-size: 11px; box-shadow: 0 4px 12px rgba(0,0,0,.25); z-index: 200; flex-wrap: wrap; max-width: calc(100vw - 32px); }
  .wn-demo__group { display: inline-flex; align-items: center; gap: 2px; }
  .wn-demo__group[aria-disabled="true"] { opacity: .35; pointer-events: none; }
  .wn-demo__lbl { opacity: .6; margin-right: 4px; text-transform: uppercase; letter-spacing: .05em; font-size: 9.5px; }
  .wn-demo__opt { border: none; background: transparent; color: #fff; font: inherit; padding: 5px 9px; border-radius: 999px; cursor: pointer; opacity: .7; }
  .wn-demo__opt:hover { opacity: 1; }
  .wn-demo__opt[aria-pressed="true"] { background: var(--gt-green-500); opacity: 1; }
  .wn-demo__opt:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--gt-blue-500); }
</style>
</head>
<body>
<div id="root"></div>
<script>
(async () => {
  await loadReleasesSources('../..');
  const src = await (await fetch('./WhatsNewScreen.jsx')).text();
  new Function(Babel.transform(src, { presets: ['react'] }).code)();
  ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(window.WhatsNewApp));
})();
</script>
</body>
</html>
