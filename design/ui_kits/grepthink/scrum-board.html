<!-- @dsCard group="GrepThink App" viewport="1280x800" name="Scrum Board" subtitle="Sprint board with DnD + audit, stories, burnup, backlog, story detail with markdown comments" -->
<!-- @startingPoint section="Screens" subtitle="Sprint scrum board with burnup & backlog" viewport="1280x800" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>GrepThink — Scrum Board</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  html, body { margin: 0; height: 100%; }
  body { font-family: var(--gt-font-sans); background: var(--gt-gray-100); }
  a { color: var(--gt-blue-500); } a:hover { color: var(--gt-info-text); }
  .sb-app { display: flex; height: 100vh; }
  .sb-side { width: 256px; flex-shrink: 0; background: var(--gt-green-500); display: flex; flex-direction: column; padding: 0.875rem 1.2rem; box-sizing: border-box; }
  .sb-side__logo { width: 170px; filter: brightness(0) invert(1); margin-bottom: 1rem; }
  .sb-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .sb-header { display: flex; align-items: center; gap: 16px; padding: 14px 24px; background: var(--gt-gray-0); border-bottom: 1px solid var(--gt-border); }
  .sb-header h1 { margin: 0; font-size: 20px; font-weight: 600; color: var(--gt-gray-800); }
  .sb-header__sprint { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  .sb-content { flex: 1; overflow: auto; padding: 20px 24px; }
  .sb-grid { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; align-items: start; }
  .sb-stories { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
  .sb-rail { display: flex; flex-direction: column; gap: 14px; }
  .sb-panel { background: var(--gt-gray-0); border: 1px solid var(--gt-border); border-radius: 10px; padding: 14px; box-shadow: var(--gt-shadow-hairline); }
  .sb-panel h3 { margin: 0 0 10px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; color: var(--gt-gray-600); }
  .sb-section-title { display: flex; align-items: center; gap: 10px; margin: 18px 0 8px; }
  .sb-section-title h2 { margin: 0; font-size: 14px; font-weight: 600; color: var(--gt-gray-800); }
  .sb-section-title span { font-size: 11px; color: var(--gt-gray-600); }
  .sb-scale-row { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .sb-scale-row .gt-scalepicker { flex: 1; max-width: 520px; }
  .sb-scale-label { font-size: 11px; font-weight: 600; color: var(--gt-gray-600); text-transform: uppercase; letter-spacing: 0.03em; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const NS = window.GrepThinkDesignSystem_36e7e3;
const { SidebarNavItem, SidebarSectionTitle, Select, Button, AIDraftButton, ScalePicker, PointPicker,
        StoryCard, ScrumBoard, BurnupChart, BacklogRow, CommentThread, MarkdownText, Modal, Card,
        TagBadge, PointsChip, EstimateChip, UserPair, Badge } = NS;

const ME = 'Ashton Liu';
const MEMBERS = ['Ashton Liu', 'Tony Wu', 'Priya Raman', 'Landon Ngo'];

const STORIES = [
  { storyKey: 'US-2', title: 'As an instructor, I can import a roster from CSV', points: 5, estimate: '2d', reporter: 'Landon Ngo', assignee: 'Tony Wu',
    description: 'Instructors upload the Canvas CSV export and get a validated roster.\n- parse + dedupe by **edu email**\n- surface row-level errors\n- audit each import in `class_events`' },
  { storyKey: 'US-3', title: 'As a student, I can submit my TSR with per-teammate contributions', points: 8, estimate: '3d', reporter: 'Ashton Liu', assignee: 'Tony Wu',
    description: 'The TSR form posts one row per teammate via the `submit_tsr` RPC.\n- percentages must sum to **100**\n- positive + constructive feedback required\n- scrum-master notes optional' },
  { storyKey: 'US-4', title: 'As a TA, I can see sprint progress per team', points: 5, estimate: '2d', reporter: 'Priya Raman', assignee: 'Priya Raman',
    description: 'Team dashboard tiles show burnup + TSR completion.\n- reuse `BurnupChart`\n- link into the board filtered by team' },
];

const INITIAL_TASKS = [
  { id: 1, taskKey: 'GT-9',  storyKey: 'US-2', title: 'Fix roster CSV import crash on empty rows', tags: ['bug', 'backend'], points: 1, estimate: '2h', reporter: 'Landon Ngo', assignee: 'Tony Wu', status: 'done', moved: { to: 'Done', by: 'Tony Wu', at: 'Mon' }, pr: { label: '!17', url: 'https://git.ucsc.edu', state: 'merged', provider: 'gitlab' }, commentCount: 3 },
  { id: 2, taskKey: 'GT-11', storyKey: 'US-2', title: 'Row-level validation errors in import preview', tags: ['frontend', 'ui/ux'], points: 3, estimate: '5h', reporter: 'Landon Ngo', assignee: 'Priya Raman', status: 'in_progress', moved: { to: 'In Progress', by: 'Priya Raman', at: '2h ago' } },
  { id: 3, taskKey: 'GT-12', storyKey: 'US-3', title: 'Wire TSR submit endpoint (`submit_tsr` RPC)', tags: ['backend'], points: 3, estimate: '4h', reporter: 'Ashton Liu', assignee: 'Tony Wu', status: 'in_progress', moved: { to: 'In Progress', by: 'Tony Wu', at: '1h ago' }, pr: { label: 'PR #42', url: 'https://github.com/grepthink2/grepthink2.0', state: 'open' }, commentCount: 2 },
  { id: 4, taskKey: 'GT-13', storyKey: 'US-3', title: 'Contribution total = 100% inline validation', tags: ['frontend'], points: 2, estimate: '3h', reporter: 'Ashton Liu', assignee: 'Ashton Liu', status: 'todo' },
  { id: 5, taskKey: 'GT-14', storyKey: 'US-3', title: 'TSR reminder email copy', tags: ['docs', 'chore'], points: 1, estimate: '1h', reporter: 'Tony Wu', assignee: 'Landon Ngo', status: 'todo' },
  { id: 6, taskKey: 'GT-15', storyKey: 'US-4', title: 'Team dashboard burnup tile', tags: ['frontend', 'design'], points: 3, estimate: '6h', reporter: 'Priya Raman', assignee: 'Priya Raman', status: 'todo' },
  { id: 7, taskKey: 'GT-16', storyKey: 'US-4', title: 'Cache sprint stats query', tags: ['optimization', 'infra'], points: 2, estimate: '3h', reporter: 'Priya Raman', assignee: 'Tony Wu', status: 'todo' },
];

const BACKLOG = [
  { storyKey: 'US-9',  title: 'Export TSR history as CSV', points: 5, estimate: '2d', reporter: 'Ashton Liu', assignee: 'Priya Raman', archivedAt: 'Jun 12' },
  { storyKey: 'US-11', title: 'Dark mode for the scrum board', points: 3, estimate: '1d', reporter: 'Landon Ngo', assignee: 'Tony Wu', archivedAt: 'Jul 02' },
  { storyKey: 'US-13', title: 'Slack webhook on sprint close', points: 2, estimate: '4h', reporter: 'Tony Wu', assignee: 'Ashton Liu', archivedAt: 'Jul 28' },
];

const COMMENTS = {
  'US-3': [
    { author: 'Tony Wu', time: '2h ago', body: '@AshtonLiu the `submit_tsr` RPC is **done** — see [PR #42](https://github.com/grepthink2/grepthink2.0)' },
    { author: 'Ashton Liu', time: '1h ago', body: 'Nice. Remaining before review:\n- error toast on `409`\n- *optimistic* row update' },
  ],
  'US-2': [
    { author: 'Priya Raman', time: 'Mon', body: 'Import preview needs the **error column** pinned — @LandonNgo can you check the Canvas export edge case?' },
  ],
  'US-4': [],
};

const Home = () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>;
const Folder = () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>;
const Board = () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="18" rx="2" stroke="currentColor" strokeWidth="2"/><path d="M9 3v18M15 3v12" stroke="currentColor" strokeWidth="2"/></svg>;
const Msg = () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>;

function App() {
  const [tasks, setTasks] = React.useState(INITIAL_TASKS);
  const [sprint, setSprint] = React.useState('s3');
  const [scale, setScale] = React.useState('fibonacci');
  const [openStory, setOpenStory] = React.useState(null);
  const [draft, setDraft] = React.useState('');
  const [comments, setComments] = React.useState(COMMENTS);
  const [aiBusy, setAiBusy] = React.useState(false);

  const onMove = (id, to) => {
    const label = { todo: 'TODO', in_progress: 'In Progress', done: 'Done' }[to];
    setTasks((ts) => ts.map((t) => t.id === id ? { ...t, status: to, moved: { to: label, by: ME, at: 'just now' } } : t));
  };

  const rollup = (key) => {
    const st = tasks.filter((t) => t.storyKey === key);
    const done = st.filter((t) => t.status === 'done');
    return { tasksDone: done.length, tasksTotal: st.length, pointsDone: done.reduce((s, t) => s + (t.points || 0), 0) };
  };

  const story = STORIES.find((s) => s.storyKey === openStory);
  const storyTasks = story ? tasks.filter((t) => t.storyKey === story.storyKey) : [];

  return (
    <div className="sb-app">
      <aside className="sb-side">
        <img className="sb-side__logo" src="../../assets/grepthink-logo.svg" alt="GrepThink" />
        <SidebarSectionTitle>Main</SidebarSectionTitle>
        <SidebarNavItem icon={<Home />} label="Home" />
        <SidebarNavItem icon={<Folder />} label="Projects" />
        <SidebarNavItem icon={<Board />} label="Scrum Board" active />
        <SidebarNavItem icon={<Msg />} label="Messages" badge={3} />
      </aside>

      <div className="sb-main">
        <header className="sb-header">
          <h1>Scrum Board</h1>
          <Badge tone="neutral">Grepthink 2.0 · Team 1</Badge>
          <div className="sb-header__sprint">
            <Select value={sprint} onChange={(e) => setSprint(e.target.value)} options={[
              { value: 's1', label: 'Sprint 1 · closed' },
              { value: 's2', label: 'Sprint 2 · closed' },
              { value: 's3', label: 'Sprint 3 · Jan 12 – Jan 25' },
            ]} />
            <AIDraftButton loading={aiBusy} onClick={() => { setAiBusy(true); setTimeout(() => setAiBusy(false), 1400); }}>Draft story with AI</AIDraftButton>
            <Button size="md">New Story</Button>
          </div>
        </header>

        <div className="sb-content">
          <div className="sb-scale-row">
            <span className="sb-scale-label">Estimate scale</span>
            <ScalePicker value={scale} onChange={setScale} />
          </div>

          <div className="sb-grid">
            <div>
              <div className="sb-stories">
                {STORIES.map((s) => (
                  <StoryCard key={s.storyKey} {...s} {...rollup(s.storyKey)} active={openStory === s.storyKey} onOpen={() => setOpenStory(s.storyKey)} />
                ))}
              </div>
              <ScrumBoard tasks={tasks} onMove={onMove} onOpenTask={(t) => setOpenStory(t.storyKey)} />
            </div>

            <div className="sb-rail">
              <div className="sb-panel">
                <BurnupChart title="Sprint 3 burnup" subtitle="Jan 12 – Jan 25" height={110}
                  labels={['M','T','W','T','F','M','T','W','T','F']}
                  scope={[15,15,15,18,18,18,18,18,18,18]}
                  completed={[0,1,3,3,5,7,9,11,12,13]} />
              </div>
              <div className="sb-panel">
                <BurnupChart title="Cumulative burnup" subtitle="All sprints" height={110}
                  labels={['S1','S2','S3','S4','S5']}
                  scope={[21,40,58,58,58]}
                  completed={[18,36,49,49,49]} />
              </div>
              <div className="sb-panel" style={{padding: 0}}>
                <h3 style={{padding: '12px 14px 0'}}>Backlog</h3>
                {BACKLOG.map((b) => (
                  <BacklogRow key={b.storyKey} {...b} onRestore={() => {}} onOpen={() => {}} />
                ))}
              </div>
            </div>
          </div>
        </div>
      </div>

      {story && (
        <Modal open onClose={() => setOpenStory(null)} width={640}
          title={<span style={{fontSize: '1.2rem'}}>{story.storyKey} · {story.title}</span>}>
          <div style={{display:'flex', alignItems:'center', gap:10, justifyContent:'center', marginBottom:14, flexWrap:'wrap'}}>
            <PointsChip points={story.points} />
            <EstimateChip estimate={story.estimate} />
            <UserPair reporter={story.reporter} assignee={story.assignee} size="sm" />
            <PointPicker scale={scale} value={story.points} onChange={() => {}} />
          </div>
          <MarkdownText members={MEMBERS}>{story.description}</MarkdownText>
          <div style={{display:'flex', flexDirection:'column', gap:6, margin:'14px 0'}}>
            {storyTasks.map((t) => (
              <div key={t.id} style={{display:'flex', alignItems:'center', gap:8, padding:'7px 10px', border:'1px solid var(--gt-gray-300)', borderRadius:7, fontSize:12}}>
                <span style={{fontFamily:'var(--gt-font-mono)', fontSize:10.5, color:'var(--gt-gray-600)'}}>{t.taskKey}</span>
                <span style={{flex:1, fontWeight:500, color:'var(--gt-gray-800)'}}>{t.title}</span>
                {t.tags && t.tags.slice(0,2).map((tag) => <TagBadge key={tag} tag={tag} />)}
                <Badge tone={t.status === 'done' ? 'success' : t.status === 'in_progress' ? 'info' : 'neutral'}>
                  {t.status === 'done' ? 'Done' : t.status === 'in_progress' ? 'In Progress' : 'TODO'}
                </Badge>
              </div>
            ))}
            <AIDraftButton size="sm">Suggest tasks</AIDraftButton>
          </div>
          <CommentThread
            members={MEMBERS}
            comments={comments[story.storyKey] || []}
            value={draft}
            onChange={setDraft}
            onSubmit={(body) => {
              setComments((c) => ({ ...c, [story.storyKey]: [...(c[story.storyKey] || []), { author: ME, time: 'just now', body }] }));
              setDraft('');
            }} />
        </Modal>
      )}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
