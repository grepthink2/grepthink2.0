<style>
  html, body { margin: 0; height: 100%; }
  body { font-family: var(--gt-font-sans); background: var(--gt-gray-100); color: var(--gt-text-primary); }
  a { color: var(--gt-text-link); } a:hover { color: var(--gt-info-text); }
  /* app shell (kit-only, mirrors the signed-in shell) */
  .tm-stage { height: 100vh; }
  .tm-app { display: flex; height: 100%; position: relative; overflow: hidden; }
  .tm-side { width: 256px; flex-shrink: 0; background: var(--gt-green-500); display: flex; flex-direction: column; padding: 0.875rem 1.2rem; box-sizing: border-box; }

  .tm-pv__header { display: flex; align-items: center; gap: 16px; padding: 20px 24px; margin-bottom: 24px; background: var(--gt-surface); border-radius: var(--gt-radius-md); box-shadow: var(--gt-shadow-card); flex-wrap: wrap; }

  .tm-ep__textarea { resize: vertical; line-height: 1.5; }
  .tm-ep__logo-row { display: flex; align-items: center; gap: 16px; }
  .tm-ep__logo { display: flex; align-items: center; justify-content: center; width: 64px; height: 64px; border-radius: 50%; background: var(--gt-gray-100); border: 2px solid var(--gt-border); color: var(--gt-text-secondary); }

  .tm-ep__role-row { display: flex; align-items: center; gap: 16px; padding: 8px 0; } .tm-ep__role-row + .tm-ep__role-row { border-top: 1px solid var(--gt-border); }
  .tm-ep__role-name { display: flex; align-items: center; gap: 8px; min-width: 150px; font-size: 14px; font-weight: 500; }
  .tm-ep__select { flex: 1; padding: 8px 16px; border: 1px solid var(--gt-border); border-radius: var(--gt-radius-sm); font-family: inherit; font-size: 14px; color: var(--gt-text-primary); background: var(--gt-surface); }
  .tm-ep__footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 16px; margin-top: 16px; border-top: 1px solid var(--gt-border); flex-shrink: 0; }

  .tm-states__wide { grid-column: 1 / -1; }
  .tm-caption { margin: 0 0 8px; font-size: 11.5px; color: var(--gt-text-tertiary); }

  .tm-stage--phone { display: flex; align-items: flex-start; justify-content: center; gap: 24px; padding: 24px 0; box-sizing: border-box; }

  .tm-stage--phone .tm-header { padding: 0 12px; gap: 8px; }
  .tm-stage--phone .tm-content { padding: 16px 12px 40px; }
  .tm-stage--phone .tm-card, .tm-stage--phone .tm-pv__header { padding: 16px; }
  .tm-stage--phone .tm-pv__title { font-size: 19px; }
  .tm-stage--phone .tm-ep { width: calc(100% - 24px); max-height: calc(100% - 24px); padding: 16px; }
  .tm-stage--phone .tm-ep__tab span { display: none; }
  .tm-stage--phone .gt-tm__head { flex-direction: column; align-items: stretch; }
  .tm-stage--phone .gt-tm__head .gt-button, .tm-stage--phone .gt-tm__past-toggle { min-height: 44px; }
  .tm-stage--phone .gt-tm-row { grid-template-columns: 24px minmax(0, 1fr); row-gap: 8px; }
  .tm-stage--phone .gt-tm-row__tile { width: 24px; height: 24px; }
  .tm-stage--phone .gt-tm-row__actions { grid-column: 2 / -1; justify-self: stretch; }
  .tm-stage--phone .gt-tm-row__actions .gt-tm__btn, .tm-stage--phone .gt-tm-row__actions .gt-button { flex: 1; min-height: 44px; }
  .tm-stage--phone .gt-tmform__grid--when { grid-template-columns: 1fr 1fr; }
  .tm-stage--phone .gt-tmform__grid--when > :first-child { grid-column: 1 / -1; }
  .tm-stage--phone .gt-tmform__grid--place { grid-template-columns: 1fr; }
  .tm-stage--phone .gt-tmform .gt-input, .tm-stage--phone .gt-tmform .gt-select__control { min-height: 44px; }
  .tm-stage--phone .gt-tmform__foot .gt-button { flex: 1; min-height: 44px; }
  .tm-stage--phone .gt-sched--compact .gt-sched-item__action { min-height: 44px; }
  /* demo bar (kit-only) */
  .tm-demo { position: fixed; right: 16px; bottom: 16px; display: flex; align-items: center; gap: 10px; padding: 4px 6px 4px 10px; background: var(--gt-gray-900); color: #fff; border-radius: 999px; font-size: 11px; box-shadow: 0 4px 12px rgba(0,0,0,.25); z-index: 200; flex-wrap: wrap; max-width: calc(100vw - 32px); }
  .tm-demo__group { display: inline-flex; align-items: center; gap: 2px; }
  .tm-demo__lbl { opacity: .6; margin-right: 4px; text-transform: uppercase; letter-spacing: .05em; font-size: 9.5px; }
  .tm-demo__opt { border: none; background: transparent; color: #fff; font: inherit; padding: 5px 9px; border-radius: 999px; cursor: pointer; opacity: .7; }
  .tm-demo__opt:hover { opacity: 1; }
  .tm-demo__opt[aria-pressed="true"] { background: var(--gt-green-500); opacity: 1; }
  .tm-demo__opt:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--gt-blue-500); }
  .tm-demo__log { font-family: var(--gt-font-mono); opacity: .85; padding-right: 6px; }
</style>

<div id="root"></div>
<script>
(async () => {
  await loadTeamMeetingSources('../..');
  const src = await (await fetch('./TeamMeetingsScreen.jsx')).text();
  new Function(Babel.transform(src, { presets: ['react'] }).code)();
  ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(window.TeamMeetingsApp));
})();
</script>
