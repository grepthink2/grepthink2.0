<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>og-image source — 1200×630</title>
<link rel="stylesheet" href="../../styles.css">
<style>
  /* Open Graph card. Snapshot `.og` at 1× (1200×630) and 2× (2400×1260).
     60px safe margin; all text ≥ 44px; brand green + mascot; one product card. */
  html, body { margin: 0; background: #555; }
  .og { position: relative; width: 1200px; height: 630px; overflow: hidden; background: var(--gt-green-500); font-family: var(--gt-font-sans); color: #fff; }
  .og::before { content: ''; position: absolute; inset: 0; background-image: radial-gradient(circle, rgba(255,255,255,0.16) 1.6px, transparent 2px); background-size: 28px 28px; -webkit-mask-image: radial-gradient(80% 90% at 20% 100%, #000 10%, transparent 75%); mask-image: radial-gradient(80% 90% at 20% 100%, #000 10%, transparent 75%); }
  .og::after { content: ''; position: absolute; inset: 0; background: radial-gradient(60% 80% at 100% 0%, rgba(2,160,107,0.55), transparent 70%); }
  .copy { position: absolute; left: 60px; top: 60px; bottom: 60px; width: 660px; display: flex; flex-direction: column; justify-content: space-between; z-index: 2; }
  .logo { height: 76px; width: auto; filter: brightness(0) invert(1); display: block; margin-left: -8px; }
  .pill { display: inline-flex; align-items: center; gap: 12px; align-self: flex-start; padding: 8px 22px 8px 8px; border-radius: 999px; background: rgba(255,255,255,0.14); box-shadow: inset 0 0 0 1.5px rgba(255,255,255,0.35); font-size: 44px; font-weight: 500; color: #fff; line-height: 1; }
  .pill b { background: #fff; color: var(--gt-green-700); font-size: 44px; font-weight: 700; letter-spacing: 0.04em; padding: 6px 18px; border-radius: 999px; line-height: 1; }
  .copy h1 { margin: 22px 0 18px; font-size: 68px; line-height: 1.04; letter-spacing: -0.02em; font-weight: 700; color: #fff; }
  .copy p { margin: 0; font-size: 44px; line-height: 1.25; color: rgba(255,255,255,0.86); font-weight: 400; }
  .card { position: absolute; right: 60px; top: 132px; width: 400px; z-index: 2; background: #fff; border-radius: 26px; padding: 26px 28px; box-shadow: 0 6px 16px rgba(0,0,0,0.08), 0 40px 80px -20px rgba(0,0,0,0.35); color: #212B36; rotate: -3deg; }
  .card__top { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .card__key { font-family: var(--gt-font-mono); font-size: 18px; font-weight: 600; color: #637381; }
  .card__pts { margin-left: auto; font-family: var(--gt-font-mono); font-size: 18px; font-weight: 700; color: var(--gt-green-500); background: var(--gt-green-50); border-radius: 9px; padding: 3px 12px; }
  .card__title { font-size: 26px; font-weight: 600; line-height: 1.3; margin: 0 0 16px; color: #212B36; }
  .card__tags { display: flex; gap: 8px; margin-bottom: 20px; }
  .card__tag { font-size: 16px; font-weight: 600; padding: 5px 14px; border-radius: 999px; }
  .card__foot { display: flex; align-items: center; justify-content: space-between; }
  .card__pair { display: inline-flex; align-items: center; gap: 8px; }
  .card__av { width: 38px; height: 38px; border-radius: 50%; color: #fff; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; box-shadow: 0 0 0 3px #fff; }
  .card__pr { font-size: 16px; font-weight: 600; color: #7D3C98; background: rgba(125,60,152,0.12); padding: 5px 14px; border-radius: 999px; }
  .card__audit { margin-top: 18px; padding-top: 14px; border-top: 2px dashed #e5e7eb; font-size: 17px; color: #637381; }
  .card__audit b { color: var(--gt-green-500); font-weight: 600; }
</style>
</head>
<body>
<div class="og">
  <div class="copy">
    <img class="logo" src="../../assets/grepthink-logo.svg" alt="grepthink">
    <div>
      <span class="pill"><b>NEW</b>for class projects</span>
      <h1>Scrum boards and<br>team channels</h1>
      <p>Sprints, tasks and PRs on one board. Team chat built in.</p>
    </div>
  </div>
  <div class="card">
    <div class="card__top"><span class="card__key">GT-12</span><span class="card__pts">3 pts</span></div>
    <p class="card__title">Connect the class roster API</p>
    <div class="card__tags"><span class="card__tag" style="background:#E6F4EF;color:#016547">backend</span><span class="card__tag" style="background:#EAF1FF;color:#1543A8">frontend</span></div>
    <div class="card__foot">
      <span class="card__pair"><span class="card__av" style="background:#7D3C98">PS</span><span style="color:#9aa0a6;font-size:18px">→</span><span class="card__av" style="background:#1B57D6">JL</span></span>
      <span class="card__pr">#41 merged</span>
    </div>
    <div class="card__audit">Moved to <b>Done</b> · Jordan · just now</div>
  </div>
</div>
</body>
</html>
