<!-- @dsCard group="Colors" viewport="700x150" name="Neutral grays" subtitle="Canvas #EEEEEE · border #DADADA · text 600/700/800" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;padding:16px;font-family:var(--gt-font-sans);background:#fff}
.ramp{display:grid;grid-template-columns:repeat(11,1fr);gap:0;border-radius:7px;overflow:hidden;height:74px;border:1px solid var(--gt-gray-200)}
.sw{display:flex;flex-direction:column;justify-content:flex-end;padding:6px}
.sw span{font-size:9px;font-weight:500;font-family:var(--gt-font-mono)}
.meta{display:flex;justify-content:space-between;margin-top:8px;font-size:10px;color:var(--gt-gray-600)}
.meta code{font-family:var(--gt-font-mono)}
</style></head><body>
<div class="ramp">
  <div class="sw" style="background:var(--gt-gray-0)"><span style="color:#616161">0</span></div>
  <div class="sw" style="background:var(--gt-gray-50)"><span style="color:#616161">50</span></div>
  <div class="sw" style="background:var(--gt-gray-100)"><span style="color:#616161">100</span></div>
  <div class="sw" style="background:var(--gt-gray-200)"><span style="color:#424242">200</span></div>
  <div class="sw" style="background:var(--gt-gray-300)"><span style="color:#424242">300</span></div>
  <div class="sw" style="background:var(--gt-gray-400)"><span style="color:#1C1C1C">400</span></div>
  <div class="sw" style="background:var(--gt-gray-500)"><span style="color:#fff">500</span></div>
  <div class="sw" style="background:var(--gt-gray-600)"><span style="color:#fff">600</span></div>
  <div class="sw" style="background:var(--gt-gray-700)"><span style="color:#fff">700</span></div>
  <div class="sw" style="background:var(--gt-gray-800)"><span style="color:#fff">800</span></div>
  <div class="sw" style="background:var(--gt-gray-900)"><span style="color:#fff">900</span></div>
</div>
<div class="meta"><span>canvas: <code>100 #EEEEEE</code></span><span>border: <code>300 #DADADA</code></span><span>text: <code>600 / 700 / 800</code></span></div>
</body></html>
