<!-- @dsCard group="Colors" viewport="700x150" name="Brand green ramp" subtitle="Primary #018156 · hover 700 · soft 50" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;padding:16px;font-family:var(--gt-font-sans);background:#fff}
.ramp{display:grid;grid-template-columns:repeat(10,1fr);gap:0;border-radius:7px;overflow:hidden;height:74px}
.sw{display:flex;flex-direction:column;justify-content:flex-end;padding:6px}
.sw span{font-size:9px;font-weight:500;font-family:var(--gt-font-mono)}
.meta{display:flex;justify-content:space-between;margin-top:8px;font-size:10px;color:var(--gt-gray-600)}
.meta code{font-family:var(--gt-font-mono)}
</style></head><body>
<div class="ramp">
  <div class="sw" style="background:var(--gt-green-50)"><span style="color:#016547">50</span></div>
  <div class="sw" style="background:var(--gt-green-100)"><span style="color:#016547">100</span></div>
  <div class="sw" style="background:var(--gt-green-200)"><span style="color:#014A34">200</span></div>
  <div class="sw" style="background:var(--gt-green-300)"><span style="color:#013525">300</span></div>
  <div class="sw" style="background:var(--gt-green-400)"><span style="color:#fff">400</span></div>
  <div class="sw" style="background:var(--gt-green-500);outline:2px solid #013525;outline-offset:-2px"><span style="color:#fff">500 ★</span></div>
  <div class="sw" style="background:var(--gt-green-600)"><span style="color:#fff">600</span></div>
  <div class="sw" style="background:var(--gt-green-700)"><span style="color:#fff">700</span></div>
  <div class="sw" style="background:var(--gt-green-800)"><span style="color:#fff">800</span></div>
  <div class="sw" style="background:var(--gt-green-900)"><span style="color:#fff">900</span></div>
</div>
<div class="meta"><span>CTA &amp; sidebar: <code>--gt-green-500 #018156</code></span><span>hover: <code>700 #016547</code></span><span>soft bg: <code>50 #E6F4EF</code></span></div>
</body></html>
