<!-- @dsCard group="Brand" viewport="700x210" name="Surfaces in context" subtitle="Grey canvas · white cards · green sidebar — the app's three surfaces" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;font-family:var(--gt-font-sans);display:flex;height:210px;background:var(--gt-gray-100)}
.side{width:150px;background:var(--gt-green-500);padding:12px;box-sizing:border-box;display:flex;flex-direction:column;gap:6px}
.side .item{color:#fff;font-size:10px;font-weight:500;padding:7px 9px;border-radius:8px}
.side .item.active{background:var(--gt-gray-100);color:#000}
.main{flex:1;padding:14px;display:flex;flex-direction:column;gap:10px}
.card{background:#fff;border-radius:10px;box-shadow:0 0 2.61px rgba(0,0,0,.25);padding:12px 16px;font-size:11px;color:var(--gt-gray-800)}
.card b{font-size:13px;font-weight:600;display:block;margin-bottom:2px}
.card small{color:var(--gt-gray-600);font-size:9.5px}
</style></head><body>
<div class="side">
  <img src="../assets/grepthink-logo.svg" style="width:96px;filter:brightness(0) invert(1);margin-bottom:6px" alt="">
  <div class="item active">Home</div>
  <div class="item">Messages</div>
  <div class="item">Projects</div>
</div>
<div class="main">
  <div class="card"><b>Upcoming Deadlines</b><small>White card on #EEEEEE canvas · radius 10 · 2.61px shadow</small></div>
  <div class="card"><b>Current Group</b><small>Flat and calm: no gradients, whisper shadows, 1px #DADADA dividers</small></div>
</div>
</body></html>
