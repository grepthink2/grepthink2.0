<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;padding:18px;font-family:var(--gt-font-sans);color:var(--gt-gray-800);background:#fff}
.row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.eb{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:6px 13px;border-radius:999px}
