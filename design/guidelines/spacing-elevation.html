<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;padding:22px;font-family:var(--gt-font-sans);background:var(--gt-gray-100);display:flex;gap:18px;align-items:center}
.s{width:140px;height:88px;background:#fff;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10px;color:var(--gt-gray-700);font-weight:500}

</style></head><body>
<div class="s" style="box-shadow:var(--gt-shadow-card)">card ★<code>0 0 2.61px .25</code></div>
<div class="s" style="box-shadow:var(--gt-shadow-hairline);border:1px solid var(--gt-gray-300)">hairline + border<code>0 0 4px .08</code></div>
<div class="s" style="box-shadow:var(--gt-shadow-hover)">hover<code>0 2px 12px .10</code></div>
<div class="s" style="box-shadow:var(--gt-shadow-modal)">modal<code>0 20px 60px .30</code></div>
</body></html>
