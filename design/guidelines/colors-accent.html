<!-- @dsCard group="Colors" viewport="700x140" name="Accents — blue & UCSC" subtitle="Accent blue #2771FF · gold #FDC700 (achievements only) · UCSC blue #003C6C" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;padding:16px;font-family:var(--gt-font-sans);background:#fff}
.grid{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:10px}
.acc{border-radius:7px;padding:12px;display:flex;flex-direction:column;justify-content:space-between;height:78px;box-sizing:border-box}
.acc b{font-size:12px;font-weight:600}
.acc code{font-family:var(--gt-font-mono);font-size:10px;opacity:.85}
.acc small{font-size:9px;opacity:.85;line-height:1.4}
</style></head><body>
<div class="grid">
  <div class="acc" style="background:var(--gt-blue-500);color:#fff">
    <b>Accent blue</b>
    <small>links · selection · focus rings · info</small>
    <code>--gt-blue-500 #2771FF</code>
  </div>
  <div class="acc" style="background:var(--gt-gold);color:#303030">
    <b>UCSC gold</b>
    <small>achievements, stars, “team set” only</small>
    <code>#FDC700</code>
  </div>
  <div class="acc" style="background:var(--gt-ucsc-blue);color:#fff">
    <b>UCSC blue</b>
    <small>optional institutional accent</small>
    <code>#003C6C</code>
  </div>
</div>
</body></html>
