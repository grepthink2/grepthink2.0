<!-- @dsCard group="Spacing" viewport="700x160" name="Spacing scale" subtitle="4 / 8 / 16 / 24 / 32 / 60 — 4pt-ish" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;padding:18px;font-family:var(--gt-font-sans);background:#fff}
.row{display:flex;align-items:flex-end;gap:26px}
.tok{display:flex;flex-direction:column;align-items:center;gap:6px}
.bar{background:var(--gt-green-500);border-radius:3px;width:34px}
.tok span{font-size:9px;color:var(--gt-gray-600);font-family:var(--gt-font-mono)}
</style></head><body>
<div class="row">
  <div class="tok"><div class="bar" style="height:4px"></div><span>xs · 4</span></div>
  <div class="tok"><div class="bar" style="height:8px"></div><span>sm · 8</span></div>
  <div class="tok"><div class="bar" style="height:16px"></div><span>md · 16</span></div>
  <div class="tok"><div class="bar" style="height:24px"></div><span>lg · 24</span></div>
  <div class="tok"><div class="bar" style="height:32px"></div><span>xl · 32</span></div>
  <div class="tok"><div class="bar" style="height:60px"></div><span>xxl · 60</span></div>
</div>
</body></html>
