<!-- @dsCard group="Brand" viewport="700x170" name="Logo" subtitle="Mascot + wordmark · green on light, white (filter) on green" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;padding:0;font-family:var(--gt-font-sans);display:grid;grid-template-columns:1fr 1fr;height:170px}
.half{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px}
.half small{font-size:9px;font-family:var(--gt-font-mono)}
</style></head><body>
<div class="half" style="background:#fff">
  <img src="../assets/grepthink-logo.svg" style="width:200px" alt="GrepThink">
  <small style="color:var(--gt-gray-500)">assets/grepthink-logo.svg</small>
</div>
<div class="half" style="background:var(--gt-green-500)">
  <img src="../assets/grepthink-logo.svg" style="width:200px;filter:brightness(0) invert(1)" alt="GrepThink on green">
  <small style="color:rgba(255,255,255,.7)">filter: brightness(0) invert(1)</small>
</div>
</body></html>
