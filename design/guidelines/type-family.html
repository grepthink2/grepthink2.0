<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>

.row{display:flex;align-items:baseline;gap:16px;padding:7px 0;border-bottom:1px solid var(--gt-gray-100)}
.row:last-child{border-bottom:none}
.w{width:120px;font-size:10px;color:var(--gt-gray-600);font-family:var(--gt-font-mono)}
.s{font-size:22px}
</style></head><body>
<div class="row"><span class="w">400 Regular</span><span class="s" style="font-weight:400">Team Status Report</span></div>
<div class="row"><span class="w">500 Medium ★</span><span class="s" style="font-weight:500">Team Status Report</span></div>
<div class="row"><span class="w">600 SemiBold</span><span class="s" style="font-weight:600">Team Status Report</span></div>
<div class="row"><span class="w">700 Bold</span><span class="s" style="font-weight:700">Team Status Report</span></div>
</body></html>
