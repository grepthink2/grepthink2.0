<!-- @dsCard group="Marketing" viewport="700x200" name="Dark chrome & closing band" subtitle="Header/footer #0c1f18 · closing band #0f2a20 + green tint + white dots · white-alpha text ramp" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;font-family:var(--gt-font-sans);display:grid;grid-template-columns:1fr 1.2fr;height:200px}
.chrome{background:var(--gt-mkt-dark);padding:16px 18px;display:flex;flex-direction:column;gap:7px;font-size:11px}
.chrome .t{color:#fff;font-weight:600;font-size:12px}
.chrome .r{display:flex;justify-content:space-between}
.chrome code{font-family:var(--gt-font-mono);font-size:9px;opacity:.9}
.close{position:relative;overflow:hidden;background:var(--gt-mkt-closing-tint),var(--gt-mkt-closing-bg);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px}
.close::before{content:'';position:absolute;inset:0;background-image:radial-gradient(circle,var(--gt-mkt-closing-dot) 1px,transparent 1.3px);background-size:20px 20px;-webkit-mask-image:var(--gt-mkt-closing-dot-mask);mask-image:var(--gt-mkt-closing-dot-mask)}
.close h3{position:relative;margin:0 0 6px;font-size:19px;font-weight:700;letter-spacing:-.02em}
.close p{position:relative;margin:0 0 12px;font-size:10.5px;color:var(--gt-mkt-closing-text);max-width:260px;line-height:1.5}
.close .b{position:relative;display:flex;gap:8px}
.close .b span{font-size:10px;padding:7px 14px;border-radius:7px;font-weight:600}
.go{background:var(--gt-primary);box-shadow:var(--gt-mkt-shadow-closing-cta)}.talk{box-shadow:inset 0 0 0 1.5px var(--gt-mkt-closing-outline);font-weight:500!important}
</style></head><body>
<div class="chrome">
  <span class="t">#0c1f18 · header bar &amp; footer</span>
  <span class="r" style="color:var(--gt-mkt-on-dark)">nav link<code>.82</code></span>
  <span class="r" style="color:var(--gt-mkt-on-dark-muted)">footer link<code>.72</code></span>
  <span class="r" style="color:var(--gt-mkt-on-dark-soft)">tagline<code>.60</code></span>
  <span class="r" style="color:var(--gt-mkt-on-dark-faint)">legal bar<code>.50</code></span>
  <span class="r" style="color:var(--gt-mkt-on-dark-label);text-transform:uppercase;letter-spacing:.04em">COLUMN TITLE<code>.45</code></span>
</div>
<div class="close"><h3>Ready to run your class on grepthink?</h3><p>Closing band: #0f2a20, radial rgba(2,160,107,.35) from the top, white dots masked to the bottom.</p><div class="b"><span class="go">Get started</span><span class="talk">Talk to us</span></div></div>
</body></html>
