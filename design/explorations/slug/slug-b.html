<!doctype html><html><head><meta charset="utf-8"><title>Slug option B</title><link rel="stylesheet" href="../../styles.css">
<style>
body{margin:0;min-height:100vh;display:flex;flex-direction:column;font-family:var(--gt-font-sans);color:var(--gt-text-primary);background:var(--gt-gray-0)}
a{color:var(--gt-accent)}a:hover{color:var(--gt-primary-hover)}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:32px 24px}
.big{width:min(320px,80vw);border-bottom:1px solid var(--gt-border-subtle)}
.big svg{display:block;width:100%;height:auto}
.cap{margin:0;text-align:center;font-size:13px;line-height:1.5;color:var(--gt-text-secondary);max-width:380px;text-wrap:pretty}
.cap b{display:block;font-weight:600;color:var(--gt-text-primary);font-size:15px;margin-bottom:2px}
.cap code{display:inline-block;margin-top:6px;font-family:var(--gt-font-mono);font-size:11px;background:var(--gt-surface-muted);border-radius:7px;padding:2px 7px}
.sizes{display:flex;gap:28px;align-items:flex-end}
.sizes figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:6px}
.sizes figcaption{font-family:var(--gt-font-mono);font-size:10px;color:var(--gt-text-tertiary)}
.sizes svg{display:block;height:auto;border-bottom:1px solid var(--gt-border-subtle)}
footer{position:relative;height:36px;border-top:1px solid var(--gt-border-subtle);overflow:hidden}
footer span{position:absolute;left:16px;top:12px;font-family:var(--gt-font-mono);font-size:10px;color:var(--gt-text-tertiary)}
footer svg{position:absolute;bottom:3px;left:-56px;width:48px;height:24px;animation:cross 12s linear infinite}
@keyframes cross{to{left:100%}}
@media(prefers-reduced-motion:reduce){footer svg{display:none}}
</style></head><body>
