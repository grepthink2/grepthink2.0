name: Release

# Tags each release on main and publishes its GitHub release from the release notes,
# frontend/src/features/releases/notes/<version>.md (README, "Branches, releases and the database"):
#   - push to main → when frontend/package.json's version has no v<version> tag yet, publish the
#     GitHub release v<version> at the pushed commit, which creates the tag. Its title is the
#     version and its body the notes file without the front matter. A deploy that keeps the
#     version (a Dependabot security update straight into main) finds the tag and does nothing.
#   - pull request from beta into main → fails when v<version> is tagged already or its notes file
#     is missing, so every release from beta gets a new version, notes and a tag. main's ruleset
#     requires this check; it is skipped, and so passes, on pull requests from any other branch.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  publish:
    name: Tag and publish the release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # the release creates the tag
    # Pushes close together run one at a time, so a later one finds the tag an earlier one made.
    # GitHub keeps one pending run per group, so a release and a Dependabot merge landing together can tag the later commit: rare and harmless.
    concurrency:
      group: release-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - name: Publish v<version> unless it is tagged
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./frontend/package.json').version")
          tag="v$version"
          notes="frontend/src/features/releases/notes/$version.md"
          # git ls-remote --exit-code: 0 when the tag exists, 2 when it does not, anything else when it failed.
          rc=0
          git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "$tag exists"
            exit 0
          elif [ "$rc" -ne 2 ]; then
            echo "::error::Couldn't check the tag $tag: git ls-remote exited $rc"
            exit 1
          fi
          if [ ! -f "$notes" ]; then
            echo "::error file=$notes::No release notes for $version"
            exit 1
          fi
          # The body: the notes without the front matter and the blank lines after it. CRLF
          # endings become LF first, as the notes test reads them.
          awk '{ sub(/\r$/, "") } NR == 1 && $0 == "---" { fm = 1; next } fm && $0 == "---" { fm = 0; next } !fm' "$notes" \
            | sed '/./,$!d' > "$RUNNER_TEMP/notes.md"
          gh release create "$tag" --target "$GITHUB_SHA" --title "$version" --notes-file "$RUNNER_TEMP/notes.md"

  version-check:
    name: Release version and notes
    # Only the release pull request; Dependabot's security updates into main keep the version.
    if: github.event_name == 'pull_request' && github.head_ref == 'beta'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fail unless the release has a new version and its notes
        run: |
          set -euo pipefail
          version=$(node -p "require('./frontend/package.json').version")
          notes="frontend/src/features/releases/notes/$version.md"
          how='push a release commit to beta that raises the version and adds its notes; this pull request picks it up (README, "Branches, releases and the database")'
          # 0: the tag exists; 2: it does not; anything else: the check could not run.
          rc=0
          git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "::error file=frontend/package.json::v$version is already tagged: $how."
            exit 1
          elif [ "$rc" -ne 2 ]; then
            echo "::error::Couldn't check the tag v$version: git ls-remote exited $rc. Re-run the job."
            exit 1
          fi
          if [ ! -f "$notes" ]; then
            echo "::error file=$notes::No release notes for $version: $how."
            exit 1
          fi
          echo "This release will be tagged v$version."
