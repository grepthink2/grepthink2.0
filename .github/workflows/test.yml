name: Tests

# The gates for every change:
#   - pull_request into beta or main → runs on the open PR; the rulesets in
#     .github/rulesets/ require both jobs before main accepts a merge
#   - push to beta or main → runs on the merge commit, so the README badge and
#     Codecov describe what is actually on each branch
# Vercel deploys main on its own; nothing here deploys.
on:
  push:
    branches: [beta, main]
  pull_request:
    branches: [beta, main]

# A newer push to the same branch or pull request cancels the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write # Codecov authenticates the upload with the job's OIDC token; no secret needed

jobs:
  changes:
    # Decides which suites a change needs, so a frontend-only pull request into beta does not
    # run pytest and vice versa. Anything into or on main runs both: releases stay fully gated.
    # A skipped job counts as passing for a required check.
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.diff.outputs.frontend }}
      backend: ${{ steps.diff.outputs.backend }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          TARGET: ${{ github.base_ref || github.ref_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          both() { echo "frontend=true" >> "$GITHUB_OUTPUT"; echo "backend=true" >> "$GITHUB_OUTPUT"; exit 0; }
          [ "$TARGET" = main ] && both
          if [ "$EVENT" = pull_request ]; then
            range="origin/${TARGET}...HEAD"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] \
               && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..$SHA"
          else
            both
          fi
          # Markdown never changes what a suite tests.
          files=$(git diff --name-only "$range" | grep -v '\.md$' || true)
          printf 'Changed files:\n%s\n' "$files"
          if printf '%s\n' "$files" | grep -qE '^\.github/workflows/test\.yml$'; then both; fi
          fe=false; be=false
          printf '%s\n' "$files" | grep -qE '^(frontend/|design/_ds_manifest\.json$|\.nvmrc$)' && fe=true
          printf '%s\n' "$files" | grep -qE '^(backend/|supabase/|frontend/public/\.well-known/|frontend/src/lib/api/)' && be=true
          # The backend job's API drift check reads every request in frontend/src, so a frontend
          # change that adds, removes or edits an API call needs it too.
          if [ "$be" = false ] && [ -n "$(git diff --name-only -G 'apiRequest|apiUpload|/api/' "$range" -- frontend/src)" ]; then
            be=true
          fi
          echo "frontend=$fe" >> "$GITHUB_OUTPUT"; echo "backend=$be" >> "$GITHUB_OUTPUT"
          echo "frontend=$fe backend=$be"

  frontend:
    name: Frontend (Vitest)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm run lint:design
      - name: Test with coverage
        # Thresholds live in vite.config.ts (coverage.thresholds); the run fails below them.
        run: npm run test:coverage
      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e '
              const t = require("./coverage/coverage-summary.json").total;
              const row = (k) => `| ${k} | ${t[k].pct}% | ${t[k].covered} / ${t[k].total} |`;
              console.log("### Frontend coverage\n\n| Metric | Covered | Count |\n|---|---:|---:|");
              for (const k of ["lines", "statements", "branches", "functions"]) console.log(row(k));
            ' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          flags: frontend
          files: frontend/coverage/lcov.info
          fail_ci_if_error: false
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 14

  backend:
    name: Backend (pytest)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          # The migration guard below diffs a pull request against its base branch.
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - name: API client and routes agree
        # scripts/check_api_client.py, which pytest runs too: every request in frontend/src and
        # every catalog action needs a route, and every route a caller or an allowlist reason.
        # Here each finding is also an annotation on the line it is about.
        run: python scripts/check_api_client.py
      - name: Test with coverage
        # .coveragerc: branch coverage over app/, and the fail_under threshold.
        run: pytest --cov --cov-report=term-missing:skip-covered --cov-report=xml
      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: |
          if [ -f .coverage ]; then
            {
              echo "### Backend coverage: $(coverage report --format=total)%"
              echo
              echo "<details><summary>Files below 100%</summary>"
              echo
              coverage report --format=markdown --skip-covered
              echo
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          flags: backend
          files: backend/coverage.xml
          fail_ci_if_error: false
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 14
      - name: Migration added without updating supabase/schema.sql?
        # A soft guard for a convention that is easy to forget: the snapshot is updated once a
        # migration is applied, which may be a follow-up, so this warns rather than fails.
        if: github.event_name == 'pull_request'
        run: |
          range="origin/${GITHUB_BASE_REF}...HEAD"
          added=$(git diff --name-only --diff-filter=A "$range" -- 'database/migrations/20*' ':!database/migrations/prod')
          if [ -n "$added" ] && git diff --quiet "$range" -- ../supabase/schema.sql; then
            n=$(printf '%s\n' "$added" | wc -l | tr -d ' ')
            echo "::warning title=Migration without schema snapshot::This pull request adds $n migration file(s) but does not touch supabase/schema.sql. Update the snapshot once the migration is applied (AGENTS.md, Before you commit)."
          fi
