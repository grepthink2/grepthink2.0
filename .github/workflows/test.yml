name: Tests

# Runs the full suite when code lands on `beta`:
#   - push to beta      → fires on the merge commit (a merge into beta IS a push)
#   - pull_request to beta → runs on the open PR so a failing suite can block the merge
# `main` is intentionally excluded — Vercel handles main deployments.
on:
  push:
    branches: [beta]
  pull_request:
    branches: [beta]

jobs:
  frontend:
    name: Frontend (Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test

  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: pytest
