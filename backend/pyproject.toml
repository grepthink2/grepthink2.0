[project]
name = "grepthink-backend"
version = "2.0.0"
description = "GrepThink 2.0 API (FastAPI + Supabase)"
requires-python = ">=3.11"

# ---------------------------------------------------------------------------
# pytest (moved here from pytest.ini)
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = ["ignore::DeprecationWarning"]

# ---------------------------------------------------------------------------
# ruff — linter + formatter.  From backend/:  `ruff check .`  /  `ruff format .`
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["."]
extend-exclude = [".venv", "logs"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade (py311 syntax: X | None, list[str], ...)
    "SIM",      # simplify
    "C4",       # comprehensions
]
ignore = [
    "E501",  # long lines: the formatter wraps code; long strings/log messages are allowed
    "B008",  # FastAPI's `Depends()` / `Query()` in argument defaults is the framework idiom
    "B904",  # `raise ... from err` inside except: addressed as controllers move to app.core.errors
]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]  # env vars must be set before `app` is imported

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
